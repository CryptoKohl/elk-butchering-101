# http: the original address, and where a phone fetches the CA certificate the first time.
server {
    listen 8090;
    include /etc/nginx/elk-site.inc;
}
# https: the installable app (home screen, keep screen on, works offline). Certificate from the
# home CA in ~/.local/share/elk-ca (see README).
server {
    listen 8443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/ca/server.crt;
    ssl_certificate_key /etc/nginx/ca/server.key;
    include /etc/nginx/elk-site.inc;
}
