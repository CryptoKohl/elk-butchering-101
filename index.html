<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elk Butchering 101</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#9b2a1f">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Elk 101">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root { --bg:#efe6d6; --card:#f8f2e7; --ink:#2a2420; --muted:#6f6357; --rule:#d6c8b2; --accent:#9b2a1f; --accent-soft:#f1d9d3; --ok:#4f6b3a; color-scheme: light }
@media (prefers-color-scheme: dark) { :root { --bg:#1c1916; --card:#26221e; --ink:#ece3d6; --muted:#a8998a; --rule:#3d362f; --accent:#e0705f; --accent-soft:#3a2420; --ok:#9cbc80; color-scheme: dark } }
* { box-sizing: border-box }
body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.55 "Source Serif 4", Georgia, serif }
header, main { max-width: 960px; margin: 0 auto; padding-left:max(16px, env(safe-area-inset-left)); padding-right:max(16px, env(safe-area-inset-right)) }
header { padding-block: 28px 8px; border-bottom: 3px double var(--rule) }
h1, h2, h3, nav button, .tag { font-family: Oswald, "Arial Narrow", sans-serif; letter-spacing: .02em }
h1 { margin:0; font-size: 2.2rem; text-transform: uppercase } h1 span { color: var(--accent) }
.sub { margin: 2px 0 14px; color: var(--muted) }
nav { display:flex; gap:8px; flex-wrap:wrap }
nav button { border:1px solid var(--rule); background:var(--card); color:var(--ink); padding:8px 14px; font-size:1rem; text-transform:uppercase; cursor:pointer; border-radius:2px }
nav button[aria-pressed=true] { background:var(--accent); border-color:var(--accent); color:var(--card) }
main { padding-block: 20px 60px }
h2 { font-size:1.5rem; text-transform:uppercase; margin: 28px 0 4px; border-bottom: 2px solid var(--ink); padding-bottom: 2px }
.summary { color: var(--muted); margin: 6px 0 10px; max-width: 65ch }
ul.marks { margin: 0 0 14px; padding-left: 20px } ul.marks li { margin: 2px 0 }
.cuts { display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap:14px }
.cut { background:var(--card); border:1px solid var(--rule); border-left: 5px solid var(--accent); padding: 12px 14px; min-width:0 }
.cut h3 { margin:0; font-size:1.25rem; text-transform: uppercase; display:flex; gap:8px; align-items:baseline }
.cut .n { color: var(--accent) }
.aka { color: var(--muted); font-style: italic; font-size: .9rem }
.cut ol { padding-left: 20px; margin: 8px 0 } .cut p { margin: 6px 0 }
.tag { display:inline-block; font-size:.8rem; text-transform:uppercase; background:var(--accent-soft); color:var(--accent); padding:1px 7px; margin: 2px 4px 0 0; border-radius:2px }
.tag.done { background: transparent; border:1px solid var(--ok); color: var(--ok) }
.thumbs { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px } .thumbs img { width: 84px; height: 112px; object-fit: cover; border:1px solid var(--rule); cursor: zoom-in }
.table-wrap { overflow-x:auto; border:1px solid var(--rule); background: var(--card) }
table { border-collapse: collapse; width:100%; font-size:.95rem } th, td { padding: 6px 10px; border-bottom: 1px solid var(--rule); text-align:left; white-space: nowrap }
th { font-family: Oswald, sans-serif; text-transform: uppercase; font-weight:500; color: var(--muted) } td.num { text-align:right; font-variant-numeric: tabular-nums }
.stats { display:flex; gap:24px; flex-wrap:wrap; margin: 10px 0 16px } .stats b { display:block; font: 600 2rem Oswald, sans-serif; color: var(--accent) }
.gallery { display:grid; grid-template-columns: repeat(auto-fill, minmax(180px,1fr)); gap:12px } .gallery figure { margin:0 } .gallery img { width:100%; aspect-ratio: 3/4; object-fit: cover; border:1px solid var(--rule); cursor: zoom-in }
figcaption { font-size:.85rem; color: var(--muted) }
dialog { border:none; padding:0; background:transparent; max-width: 96vw } dialog img { max-height: 92vh; max-width: 96vw; display:block } dialog::backdrop { background: rgba(0,0,0,.8) }

/* elk map */
.map { display:grid; grid-template-columns: minmax(0,1fr) 250px; gap:16px; margin: 18px 0 8px; background:var(--card); border:1px solid var(--rule); padding:14px }
@media (max-width: 760px) { .map { grid-template-columns: 1fr } }
.map svg { width:100%; height:auto; display:block; touch-action: manipulation }
.map .rg { cursor:pointer; stroke: rgba(255,248,238,.9); stroke-width: 2.5; stroke-dasharray: 8 5; fill-opacity: .4; mix-blend-mode: multiply; transition: fill-opacity .15s }
.map .rg.tl { mix-blend-mode: normal; fill-opacity: 1 }
.map .cutlayer.off .rg:not(:hover):not(:focus) { fill-opacity: 0; stroke-opacity: .0 }
.map .rg:hover, .map .rg:focus { fill-opacity: .85; outline: none }
.map .done { fill: url(#hatch); pointer-events: none }
.map .lbl { font: 600 27px Oswald, sans-serif; letter-spacing: .05em; text-transform: uppercase; pointer-events: none }
.map .in { fill:#fff8ee; paint-order: stroke; stroke: rgba(40,15,10,.7); stroke-width: 5px }
.map .co { cursor:pointer } .map .co text { fill: var(--ink) } .map .co line { stroke: var(--ink); stroke-width: 2; opacity: .7 } .map .co circle { fill: var(--ink) }
.map .co:hover text, .map .co.on text { fill: var(--accent) }
.map #hl { fill:none; stroke: #fff; stroke-width: 6; mix-blend-mode: normal; pointer-events:none; stroke-linejoin: round }
.map .key { font-size:.85rem; color:var(--muted); margin-top:6px; display:flex; gap:14px; flex-wrap:wrap; align-items:center }
.map .key label { cursor:pointer }
.panel h3 { margin:0; font-size:1.4rem; text-transform:uppercase } .panel .pr { color:var(--muted); font: 500 .85rem Oswald, sans-serif; text-transform:uppercase; letter-spacing:.05em }
.panel p { margin: 6px 0 } .panel ul { padding-left: 18px; margin: 6px 0 }
.panel a { color: var(--accent) }
.progress { height:8px; background: var(--rule); border-radius: 4px; overflow:hidden; margin: 6px 0 2px } .progress i { display:block; height:100%; background: var(--ok) }
.cut.flash { outline: 3px solid var(--accent); outline-offset: 2px; transition: outline-color 1.5s }

/* break down */
.quarters { display:grid; grid-template-columns: repeat(auto-fill, minmax(170px,1fr)); gap:10px; margin: 14px 0 }
.quarters button { text-align:left; background:var(--card); border:1px solid var(--rule); border-left:5px solid var(--rule); padding:10px 12px; cursor:pointer; color:var(--ink); font: 500 1.05rem Oswald, sans-serif; text-transform:uppercase }
.quarters button small { display:block; font: .85rem "Source Serif 4", serif; text-transform:none; color:var(--muted) }
.quarters button[aria-pressed=true] { border-left-color: var(--accent); background: var(--accent-soft) }
.bd { display:grid; grid-template-columns: minmax(0,1.25fr) minmax(0,1fr); gap:18px; align-items:start }
@media (max-width: 760px) { .bd { grid-template-columns: 1fr } }
.bd ol.order { padding-left: 0; list-style:none; margin: 8px 0 } .bd ol.order > li { border:1px solid var(--rule); background:var(--card); margin-bottom:6px }
.bd ol.order summary { padding: 8px 10px; cursor:pointer; font: 500 1.05rem Oswald, sans-serif; text-transform:uppercase; display:flex; gap:8px; align-items:center }
.bd ol.order .body { padding: 0 12px 10px } .bd ol.order > li.next { border-color: var(--accent); box-shadow: inset 4px 0 0 var(--accent) }
.st { font-size:.75rem; padding:1px 6px; border-radius:2px; margin-left:auto } .st.ok { color:var(--ok); border:1px solid var(--ok) } .st.nx { background:var(--accent); color:var(--card) }
.chat { background:var(--card); border:1px solid var(--rule); padding: 12px; display:flex; flex-direction:column; gap:12px }
.msg { max-width: 100% } .msg.you { align-self:flex-end; background: var(--accent-soft); padding: 8px 10px; border-radius: 6px; max-width: 85% }
.msg.you img { max-width: 160px; display:block; border-radius:4px; margin-bottom:4px; cursor: zoom-in }
.msg.ai img { width:100%; max-height: 70vh; object-fit: contain; background:#000; border-radius:4px; cursor: zoom-in }
.msg.ai ol { padding-left: 22px; margin: 6px 0 } .msg.ai ol li { margin: 4px 0 }
.msg .who { font: 500 .8rem Oswald, sans-serif; text-transform: uppercase; color: var(--muted); letter-spacing:.05em }
.warn { border-left: 4px solid #c98a1b; background: rgba(201,138,27,.12); padding: 6px 10px; margin: 6px 0 }
.wait { color: var(--muted); font-style: italic } .wait::after { content: " ●"; animation: blink 1s infinite } @keyframes blink { 50% { opacity: .2 } }
.composer { display:grid; gap:8px; border-top: 1px solid var(--rule); padding-top: 10px }
.composer textarea, .composer input[type=text] { width:100%; font: inherit; padding: 8px; border:1px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 2px }
.composer .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center }
.btn { font: 500 1rem Oswald, sans-serif; text-transform:uppercase; border:1px solid var(--accent); background: var(--accent); color: var(--card); padding: 9px 16px; cursor:pointer; border-radius:2px }
.btn.ghost { background: transparent; color: var(--accent) } .btn:disabled { opacity:.5; cursor: wait }
label.file { display:inline-flex } label.file input { display:none }
.preview { max-height: 120px; border-radius: 4px; border:1px solid var(--rule) }
.empty { color: var(--muted) }
.install { margin: 0 0 12px; font-size: .95rem } .install a { color: var(--accent); font-weight: 600 } body.has-bar .install { display:none }
.st.pg { color:#b5761a; border:1px solid #b5761a } .bd ol.order > li.prog { box-shadow: inset 4px 0 0 #c98a1b }
.btn.sm { font-size:.85rem; padding: 5px 10px } .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap }
h3.day { font: 500 1.05rem Oswald, sans-serif; text-transform:uppercase; margin: 12px 0 2px; color: var(--muted) }

/* quarter photo viewer */
.viewer { background: var(--card); border:1px solid var(--rule); padding: 10px; margin: 8px 0 14px }
.viewer.novw p { margin:0; color: var(--muted) }
.vtabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom: 8px }
.vtabs button { font: 500 .9rem Oswald, sans-serif; text-transform:uppercase; border:1px solid var(--rule); background:transparent; color:var(--ink); padding: 4px 10px; cursor:pointer; border-radius:2px }
.vtabs button[aria-pressed=true] { background: var(--ink); color: var(--card); border-color: var(--ink) }
svg.photo { display:block; width:100%; max-height: 72vh; touch-action: manipulation; background: radial-gradient(ellipse at center, rgba(0,0,0,.06), transparent 70%) }
.vr { cursor:pointer; stroke-width: var(--sw); stroke-linejoin: round; transition: fill-opacity .15s }
.vr:focus { outline:none }
.vr.cut { fill:#e07b54; fill-opacity:.18; stroke:#fff8ee; stroke-opacity:.7; stroke-dasharray: calc(var(--sw)*3) calc(var(--sw)*2) }
.vr.cut.next { fill:#d0402a; fill-opacity:.45; stroke:#fff; stroke-opacity:1 }
.vr.cut.prog { fill:#e3a32b; fill-opacity:.45; stroke:#fff3d6; stroke-opacity:1 }
.vr.cut.done { fill:url(#vhatch); fill-opacity:1; stroke:#fff8ee; stroke-opacity:.6 }
.vr.mark { fill:#35b6e0; fill-opacity:.3; stroke:#bfefff; stroke-dasharray: calc(var(--sw)*2) calc(var(--sw)*2) }
.vr:hover, .vr:focus-visible { fill-opacity:.65 } .vr.done:hover { fill:#888; fill-opacity:.5 }
.vr.sel { fill-opacity:.7; stroke:#fff; stroke-opacity:1; stroke-width: calc(var(--sw)*2); stroke-dasharray: none }
.vl { cursor:pointer } .vl .hit { stroke: transparent; stroke-width: calc(var(--sw)*8); fill:none }
.vl .ln { stroke:#e8281c; stroke-width: calc(var(--sw)*1.6); stroke-dasharray: calc(var(--sw)*4) calc(var(--sw)*3); fill:none; stroke-linecap: round }
.vl.sel .ln, .vl:hover .ln { stroke:#fff; stroke-dasharray:none }
.vt { font-family: Oswald, sans-serif; font-weight:600; fill:#fff8ee; paint-order: stroke; stroke: rgba(30,10,6,.8); stroke-width: .18em; pointer-events:none; text-transform: uppercase }
.vt.done { fill:#d9d0c4 } .vt.mk { fill:#d6f5ff }
.vkey { display:flex; flex-wrap:wrap; gap: 4px 12px; font-size:.8rem; color: var(--muted); margin-top: 6px }
.vkey i.k { display:inline-block; width:12px; height:12px; margin-right:4px; vertical-align:-1px; border:1px solid var(--rule) }
.k.next { background:#d0402a } .k.prog { background:#e3a32b } .k.done { background: repeating-linear-gradient(45deg,#bbb 0 3px,#eee 3px 6px) } .k.later { background: rgba(224,123,84,.3) } .k.mark { background: rgba(53,182,224,.5) } .k.line { background: linear-gradient(#e8281c,#e8281c) center/100% 3px no-repeat }
.vcard { border-top: 1px solid var(--rule); padding-top: 8px; margin-top: 8px } .vcard h3 { margin:0; font: 600 1.15rem Oswald, sans-serif; text-transform:uppercase; display:flex; gap:8px; align-items:center } .vcard p { margin: 6px 0 } .vcard a { color: var(--accent) }
.spin { cursor: grab; touch-action: pan-y; user-select:none } .spin:active { cursor: grabbing } .spin img { width:100%; max-height:72vh; object-fit: contain; display:block }
.spinr { width:100% }
/* ---- at the carcass: big targets, one thing at a time */
body.has-bar header { padding-block: 10px 6px } body.has-bar header .sub { display:none } body.has-bar h1 { font-size: 1.5rem }
body.has-bar .picker button { flex-basis: 84px; grid-template-rows: 54px auto auto; font-size: .72rem; padding: 6px 4px } body.has-bar .picker img, body.has-bar .picker .noimg { height: 54px } body.has-bar .picker .ring { width: 30px; height: 30px } body.has-bar .picker .ring b { width: 24px; height: 24px; font-size: .6rem }
.focus a, #pane a { color: var(--accent) }
body.has-bar main { padding-bottom: calc(110px + env(safe-area-inset-bottom)) }
.picker { display:flex; gap:8px; overflow-x:auto; padding: 4px 2px 10px; margin: 6px 0 4px; scroll-snap-type: x proximity }
.picker button { flex: 0 0 108px; scroll-snap-align:start; display:grid; grid-template-rows: 92px auto auto; justify-items:center; gap:4px; padding:8px 6px; background:var(--card); border:1px solid var(--rule); border-radius:4px; cursor:pointer; color:var(--ink); font: 500 .85rem/1.15 Oswald, sans-serif; text-transform:uppercase; text-align:center }
.picker button[aria-pressed=true] { border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); background: var(--accent-soft) }
.picker img { height:92px; width:100%; object-fit:contain }
.picker .noimg { height:92px; display:grid; place-items:center; color:var(--muted); font: italic .75rem "Source Serif 4", serif; text-transform:none; border:1px dashed var(--rule); width:100%; border-radius:3px }
.ring { --p:0%; width:38px; height:38px; border-radius:50%; display:inline-grid; place-items:center; flex:none; background: conic-gradient(var(--ok) var(--p), var(--rule) 0) }
.ring b { width:30px; height:30px; border-radius:50%; background:var(--card); display:grid; place-items:center; font: 600 .7rem Oswald, sans-serif; color:var(--ink) }
.phead { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-top: 10px } .phead h2 { margin:0; border:0; flex: 1 1 auto } .phead .pr { color:var(--muted); font: 500 .9rem Oswald, sans-serif; text-transform:uppercase }
.awake { font: .85rem "Source Serif 4", serif; border:1px solid var(--rule); background:transparent; color:var(--muted); border-radius:20px; padding: 8px 12px; min-height:40px; cursor:pointer } .awake[aria-pressed=true] { color:var(--ok); border-color:var(--ok) }
.seg { display:grid; grid-auto-flow: column; grid-auto-columns: 1fr; border:1px solid var(--ink); border-radius:4px; overflow:hidden; margin: 10px 0 12px; position: sticky; top: 0; z-index: 5; background: var(--bg) }
.seg button { min-height:48px; border:0; border-left:1px solid var(--ink); background:transparent; color:var(--ink); font: 500 .95rem/1.1 Oswald, sans-serif; text-transform:uppercase; cursor:pointer; padding: 4px } .seg button:first-child { border-left:0 }
.seg button[aria-selected=true] { background: var(--ink); color: var(--bg) }
.focus .pr { color:var(--muted); font: 500 .9rem Oswald, sans-serif; text-transform:uppercase; margin: 0 }
h3.big { font: 600 2rem/1.1 Oswald, sans-serif; text-transform:uppercase; margin: 2px 0 10px }
.focus .find { font-size: 1.15rem; line-height:1.5 }
ol.steps { padding-left: 0; counter-reset: s; list-style: none; margin: 10px 0 } ol.steps li { counter-increment: s; font-size: 1.2rem; line-height:1.45; padding: 10px 0 10px 48px; position:relative; border-top: 1px solid var(--rule) }
ol.steps li::before { content: counter(s); position:absolute; left:0; top: 8px; width:36px; height:36px; border-radius:50%; background: var(--accent); color: var(--card); display:grid; place-items:center; font: 600 1.1rem Oswald, sans-serif }
.actionbar { position: fixed; left:0; right:0; bottom:0; z-index: 20; display:flex; gap:8px; padding: 10px max(12px, env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--rule); box-shadow: 0 -6px 18px rgba(0,0,0,.12); max-width: 960px; margin: 0 auto }
body:not(.has-bar) .actionbar { display:none }
.btn.big { min-height: 58px; font-size: 1.1rem; padding: 10px 16px; border-radius: 4px } .actionbar .btn.big:first-child { flex: 1 1 auto; text-align:left; line-height:1.15 }
.actionbar .cam { flex: 0 0 auto; display:inline-flex; align-items:center } .cam input { display:none }
.bd ol.order summary, .order summary { min-height: 48px }
.order { padding-left:0; list-style:none } .order > li { border:1px solid var(--rule); background:var(--card); margin-bottom:6px } .order > li.next { border-color: var(--accent); box-shadow: inset 4px 0 0 var(--accent) } .order > li.prog { box-shadow: inset 4px 0 0 #c98a1b }
.order summary { padding: 8px 10px; cursor:pointer; font: 500 1.1rem Oswald, sans-serif; text-transform:uppercase; display:flex; gap:10px; align-items:center } .order .n { color: var(--accent) } .order .body { padding: 0 12px 10px }
.stage { position: relative } .zbtns { position:absolute; right:6px; top:6px; display:flex; flex-direction:column; gap:6px }
.zbtns button { width:44px; height:44px; border-radius:50%; border:1px solid var(--rule); background: color-mix(in srgb, var(--card) 85%, transparent); color:var(--ink); font: 600 1.3rem Oswald, sans-serif; cursor:pointer }
.focus svg.photo { max-height: 52vh }
.sheet { width: min(560px, 100vw); max-width:100vw; margin: auto auto 0; border-radius: 12px 12px 0 0; padding: 16px max(16px, env(safe-area-inset-left)) calc(16px + env(safe-area-inset-bottom)); background: var(--card); color: var(--ink) }
.sheet h3 { font: 600 1.4rem Oswald, sans-serif; text-transform:uppercase; margin: 6px 0 } .sheet label { display:grid; gap:4px; margin: 10px 0; font: 500 .95rem Oswald, sans-serif; text-transform:uppercase; color: var(--muted) }
.sheet input, .sheet select { font: 1.2rem "Source Serif 4", serif; padding: 10px; min-height: 52px; border:1px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 4px; width:100% }
.sh-done { display:flex; align-items:center; gap:10px; justify-content:space-between; background: color-mix(in srgb, var(--ok) 15%, transparent); border-left: 4px solid var(--ok); padding: 10px 12px; font-size: 1.05rem }
.steppers { display:grid; grid-template-columns: 1fr 1fr; gap: 12px } .stepper { display:grid; grid-template-columns: 52px 1fr 52px; gap: 4px }
.stepper button { min-height:52px; font: 600 1.5rem Oswald, sans-serif; border:1px solid var(--rule); background: var(--bg); color: var(--ink); border-radius:4px; cursor:pointer } .stepper input { text-align:center }
.sh-btns { margin-top: 14px } .sh-btns .btn { flex: 1 }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom)); z-index: 30; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 6px; max-width: 92vw }
.net { position: fixed; top: 0; left:0; right:0; z-index: 40; background: #c98a1b; color: #1c1916; padding: 6px 12px; text-align:center; font-size: .9rem }
.pbar { height: 6px; background: var(--rule); border-radius: 3px; overflow:hidden } .pbar i { display:block; height:100%; width: 95%; background: var(--accent); animation: fill 25s cubic-bezier(.1,.6,.3,1) both } @keyframes fill { from { width: 3% } }
.tiles { display:grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap:10px; margin: 12px 0 }
.tile { background: var(--card); border:1px solid var(--rule); padding: 10px 12px } .tile b { display:block; font: 600 2rem/1.1 Oswald, sans-serif; color: var(--ink) } .tile b small { font-size: 1rem; color: var(--muted) } .tile span { color: var(--muted); font-size: .9rem }
.bars { display:grid; gap: 10px; margin: 10px 0 } .bar { display:grid; grid-template-columns: 8.5em 1fr; gap: 2px 10px; align-items:center }
.bar .track { height: 14px; background: color-mix(in srgb, var(--rule) 50%, transparent); border-radius: 0 4px 4px 0 } .bar .track i { display:block; height:100%; min-width: 2px; background: var(--accent); border-radius: 0 4px 4px 0 }
.bar .val { grid-column: 2; color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums }
.plist { display:grid; gap:6px } .prow { display:flex; gap:12px; align-items:center; background: var(--card); border:1px solid var(--rule); padding: 8px 12px; color: var(--ink); text-decoration:none; min-height: 56px }
.prow b { font: 500 1.05rem Oswald, sans-serif; text-transform:uppercase; display:block } .prow small { color: var(--muted) }
details.pcards > summary { cursor:pointer; color: var(--accent); padding: 10px 0; min-height: 44px; font-size: .95rem }
.gallery { grid-template-columns: repeat(auto-fill, minmax(140px,1fr)) } .gallery img.cutout { object-fit: contain; background: var(--card) }
@media (max-width: 420px) { h3.big { font-size: 1.7rem } .seg button { font-size: .85rem } }
[hidden] { display:none !important }

<body>
<header>
  <h1>Elk Butchering <span>101</span></h1>
  <p class="sub">Cut guide and freezer log, Kohl family. Hang it, find the landmark, make one cut at a time.</p>
  <p class="install" id="install" hidden>📱 <a href="setup.html">Install it on your phone</a>: home screen, screen stays on, works without Wi-Fi. One-time setup.</p>
  <nav><button data-view="guide" aria-pressed="true">Cut guide</button><button data-view="breakdown" aria-pressed="false">Break down</button><button data-view="hunt" aria-pressed="false">2026 elk</button><button data-view="field" aria-pressed="false">Field dress</button></nav>
</header>
<main>
  <section id="guide"></section>
  <section id="breakdown" hidden></section>
  <section id="hunt" hidden></section>
  <section id="field" hidden></section>
</main>
<dialog id="zoom"><img alt=""></dialog>
<dialog id="sheet" class="sheet"></dialog>
<div id="toast" class="toast" role="status" hidden></div>
<div id="net" class="net" role="status" hidden></div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function parseCSV(text) {
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"' && text[i + 1] === '"') { f += '"'; i++ } else if (c === '"') q = false; else f += c }
    else if (c === '"') q = true; else if (c === ",") { row.push(f); f = "" }
    else if (c === "\n") { row.push(f); rows.push(row); row = []; f = "" } else if (c !== "\r") f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row) }
  const [head, ...body] = rows;
  return body.map(r => Object.fromEntries(head.map((h, i) => [h, r[i] ?? ""])));
}

function zoom(src) { const d = $("#zoom"); $("img", d).src = src; d.showModal() }
$("#zoom").addEventListener("click", e => e.currentTarget.close());


// ---- Elk cut map: a real elk photo (img/elk.webp, cut out with its mask img/elk-mask.png).
// Region points are photo pixels and overshoot the body on purpose; the mask trims them to the animal.
const P = pts => "M" + pts.map(p => p.join(" ")).join("L") + "Z";
const ELK_REGIONS = [
  { id: "neck", cuts: ["neck"], color: "#8c3b2e", d: P([[425,220],[600,218],[510,450],[470,575],[320,575],[320,440],[385,330]]), co: { at: [318,450], to: [452,390], text: "Neck" } },
  { id: "mock-tender", cuts: ["mock-tender"], color: "#c0533b", d: P([[600,218],[665,218],[565,455],[510,450]]), co: { at: [318,515], to: [568,340], text: "Mock tender" } },
  { id: "flat-iron", cuts: ["flat-iron"], color: "#a93c2c", d: P([[665,218],[724,220],[696,432],[565,455]]), co: { at: [850,100], to: [668,330], text: "Flat iron" } },
  { id: "clod", cuts: ["clod"], color: "#d0583a", d: P([[565,455],[696,432],[692,520],[650,545],[578,538]]), co: { at: [318,660], to: [628,488], text: "Clod" } },
  { id: "brisket", cuts: ["brisket-rib-flaps"], color: "#d27d60", d: P([[510,450],[565,455],[578,538],[560,600],[470,600],[470,575]]), co: { at: [318,590], to: [528,530], text: "Brisket" } },
  { id: "fore-shank", cuts: ["fore-shank"], color: "#86372b", d: P([[560,600],[578,538],[650,545],[692,520],[790,540],[790,670],[560,670]]), co: { at: [470,735], to: [622,615], text: "Fore shank" } },
  { id: "backstrap", cuts: ["backstrap-steaks","backstrap-roast","backstrap-trim"], primal: "backstrap", color: "#7a1d18", d: P([[724,200],[988,215],[988,306],[712,306]]), label: [850,280, "Backstrap"] },
  { id: "ribs", cuts: ["rib-trim"], name: "Ribs", color: "#c86c53", d: P([[712,306],[880,306],[880,580],[692,580],[692,520],[696,432]]), label: [790,440, "Ribs"] },
  { id: "flank", cuts: ["rib-trim"], name: "Flank", note: "The thin belly wall. It goes in with the rib trim.", color: "#d98d6f", d: P([[880,306],[988,306],[978,420],[962,580],[880,580]]), label: [930,445, "Flank"] },
  { id: "top-sirloin", cuts: ["top-sirloin"], color: "#8e2a21", d: P([[988,215],[1100,235],[1085,322],[1022,342],[988,306]]), co: { at: [1150,100], to: [1040,285], text: "Top sirloin" } },
  { id: "sirloin-tip", cuts: ["sirloin-tip"], color: "#b44f39", d: P([[988,306],[1022,342],[1032,442],[1002,532],[962,580],[978,420]]), co: { at: [965,750], to: [1000,450], text: "Sirloin tip" } },
  { id: "top-round", cuts: ["top-round"], color: "#a13a2c", d: P([[1100,235],[1200,290],[1200,402],[1062,422],[1032,442],[1022,342],[1085,322]]), co: { at: [1205,330], to: [1120,345], text: "Top round" } },
  { id: "bottom-round", cuts: ["bottom-round"], color: "#c46045", d: P([[1032,442],[1062,422],[1200,402],[1200,525],[1100,565],[1002,532]]), co: { at: [1205,520], to: [1080,495], text: "Bottom round" } },
  { id: "eye-of-round", cuts: ["eye-of-round"], color: "#6f241c", ellipse: [1128,452,20,52], co: { at: [1205,425], to: [1132,440], text: "Eye of round" } },
  { id: "hind-shank", cuts: ["hind-shank"], color: "#85402f", d: P([[1002,532],[1100,565],[1200,525],[1200,690],[1040,690],[1040,600]]), co: { at: [1205,640], to: [1110,625], text: "Hind shank" } },
];
const TENDERLOIN = "M850 322C890 304 960 300 1005 308C1000 322 960 332 900 332C875 332 858 328 850 322Z";

function elkMap(cuts, done) {
  const byId = Object.fromEntries(cuts.cuts.map(c => [c.id, c]));
  const shape = r => r.ellipse ? `<ellipse cx="${r.ellipse[0]}" cy="${r.ellipse[1]}" rx="${r.ellipse[2]}" ry="${r.ellipse[3]}" transform="rotate(-8 ${r.ellipse[0]} ${r.ellipse[1]})"` : `<path d="${r.d}"`;
  const isDone = r => r.cuts.every(id => done.has(id));
  const regions = ELK_REGIONS.map(r => `${shape(r)} class="rg" fill="${r.color}" data-r="${r.id}" tabindex="0" role="button" aria-label="${esc(r.name || byId[r.cuts[0]]?.name || r.id)}"/>`).join("");
  const hatches = ELK_REGIONS.filter(isDone).map(r => `${shape(r)} class="done"/>`).join("");
  const labels = ELK_REGIONS.filter(r => r.label).map(r => `<text class="lbl in" x="${r.label[0]}" y="${r.label[1]}" text-anchor="middle">${r.label[2]}</text>`).join("");
  const callouts = [...ELK_REGIONS.filter(r => r.co), { id: "tenderloin", co: { at: [1010,170], to: [925,318], text: "Tenderloin" } }].map(r => {
    const [x, y] = r.co.at, [tx, ty] = r.co.to, right = x > tx + 40, anchor = x < tx - 40 ? "end" : right ? "start" : "middle";
    const ly = anchor === "middle" ? (y < ty ? y + 8 : y - 26) : y - 9;
    return `<g class="co" data-r="${r.id}"><line x1="${anchor === "end" ? x + 8 : right ? x - 8 : x}" y1="${ly}" x2="${tx}" y2="${ty}"/><circle cx="${tx}" cy="${ty}" r="5"/><text class="lbl" x="${x}" y="${y}" text-anchor="${anchor}">${r.co.text}${(r.cuts || ["tenderloin"]).every(id => done.has(id)) ? " ✓" : ""}</text></g>`;
  }).join("");
  const total = cuts.cuts.length, nDone = cuts.cuts.filter(c => done.has(c.id)).length;
  return `<div class="map"><div>
    <svg viewBox="60 40 1340 730" role="img" aria-labelledby="elk-t"><title id="elk-t">Elk cut map. Select a cut for details.</title>
      <defs>
        <mask id="elkmask" maskUnits="userSpaceOnUse" x="0" y="0" width="1344" height="768"><image href="img/elk-mask.png" width="1344" height="768"/></mask>
        <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="12" stroke="rgba(255,248,238,.5)" stroke-width="3"/></pattern>
        <radialGradient id="shadow"><stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
      </defs>
      <ellipse cx="880" cy="760" rx="360" ry="22" fill="url(#shadow)"/>
      <image href="img/elk.webp" width="1344" height="768"/>
      <g mask="url(#elkmask)" class="cutlayer">${regions}${hatches}<g id="hlwrap"></g></g>
      <path d="${TENDERLOIN}" class="rg tl" data-r="tenderloin" tabindex="0" role="button" aria-label="Tenderloin" fill="rgba(232,176,75,.75)" stroke="#f3c463" stroke-width="3" stroke-dasharray="9 6"/>
      ${labels}${callouts}
    </svg>
    <div class="key"><label><input type="checkbox" id="showdone" checked> Shade cuts done in 2026</label><label><input type="checkbox" id="showcuts" checked> Show cuts</label><span>Dashed = inside the body cavity</span></div>
  </div>
  <aside class="panel" id="panel" aria-live="polite"><h3>2026 elk</h3><p class="pr">${nDone} of ${total} cuts done</p>
    <div class="progress"><i style="width:${(nDone / total * 100).toFixed(0)}%"></i></div>
    <p>Tap a cut on the elk to see where it is, what to make of it and how it's packed, or to break that quarter down with photos.</p>
    <div class="quarters" style="grid-template-columns:1fr">${cuts.primals.map(p => `<button data-q="${p.id}">${esc(p.name)}<small>${p.order.filter(id => done.has(id)).length} of ${p.order.length} done · break it down →</small></button>`).join("")}</div></aside></div>`;
}

function wireMap(cuts, done) {
  const byId = Object.fromEntries(cuts.cuts.map(c => [c.id, c]));
  const primalOf = id => cuts.primals.find(p => p.order.includes(id));
  const regionOf = id => ELK_REGIONS.find(r => r.id === id) || { id, cuts: [id] };
  const svg = $(".map svg"), panel = $("#panel");
  const select = id => {
    const r = regionOf(id), list = r.cuts.map(c => byId[c]).filter(Boolean), c = list[0], pr = primalOf(c.id);
    svg.querySelectorAll(".co").forEach(g => g.classList.toggle("on", g.dataset.r === id));
    const src = svg.querySelector(`.rg[data-r="${id}"]`);
    $("#hlwrap", svg).innerHTML = src && id !== "tenderloin" ? src.outerHTML.replace(/class="rg"/, 'id="hl"').replace(/tabindex="0"/, "") : "";
    const link = x => `<a href="#cut-${x.id}" data-jump="${x.id}">${esc(x.name)}</a>${done.has(x.id) ? " ✓" : ""}`;
    panel.innerHTML = list.length > 1
      ? `<p class="pr">${esc(pr?.name)}</p><h3>${esc(r.name || pr?.name)}</h3><p>${esc(pr?.summary)}</p><ul>${list.map(x => `<li>${link(x)} · <span class="aka">${esc(x.uses.join(", "))}</span></li>`).join("")}</ul>`
      : `<p class="pr">${esc(pr?.name)} · cut ${pr.order.indexOf(c.id) + 1} of ${pr.order.length}</p><h3>${esc(r.name || c.name)}</h3>
        ${r.name ? `<p class="aka">${esc(r.note || "")} Packed as: ${esc(c.name)}.</p>` : c.aka ? `<div class="aka">${c.aka.map(esc).join(" · ")}</div>` : ""}
        <p><b>Find it:</b> ${esc(c.find)}</p>
        <div>${c.uses.map(u => `<span class="tag">${esc(u)}</span>`).join("")}${done.has(c.id) ? `<span class="tag done">done${PUBLIC ? "" : " 2026"}</span>` : ""}</div>
        <p class="aka">${esc(c.pack)}</p><p>${link({ ...c, name: "Show the steps ↓" })}</p>`;
    panel.insertAdjacentHTML("beforeend", `<p><button class="btn" data-q="${pr.id}">Break down the ${esc(pr.name.toLowerCase())} →</button></p>`);
  };
  svg.addEventListener("click", e => { const t = e.target.closest("[data-r]"); if (t) select(t.dataset.r) });
  svg.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.dataset.r) { e.preventDefault(); select(e.target.dataset.r) } });
  panel.addEventListener("click", e => {
    const q = e.target.closest("[data-q]"); if (q) return openBreakdown(q.dataset.q);
    const a = e.target.closest("[data-jump]"); if (!a) return; e.preventDefault();
    const card = document.getElementById("cut-" + a.dataset.jump); if (!card) return;
    card.closest("details")?.setAttribute("open", "");
    card.scrollIntoView({ behavior: "smooth", block: "center" }); card.classList.add("flash"); setTimeout(() => card.classList.remove("flash"), 1600);
  });
  $("#showdone").addEventListener("change", e => svg.querySelectorAll(".done").forEach(h => h.style.display = e.target.checked ? "" : "none"));
  $("#showcuts").addEventListener("change", e => $(".cutlayer", svg).classList.toggle("off", !e.target.checked));
}


// ---- Break down: pick the piece on the hook (shoulder #1, hindquarter #2...). Four tabs: the next
// cut (focused photo, big steps), all photos, the whole cut order, and Ask Claude. A bar fixed at the
// bottom holds the two things you do with gloves on: mark the cut done, and send a photo.
let CUTS, DONE, HUNT, LOG = [], BD = null, VIEW = 0, SEL = null, TAB = "next";
// The public copy (tools/build_public.py) has no server behind it: no Claude, no photo uploads, and
// each person's progress and freezer log live on their own phone.
const PUBLIC = !!window.ELK_PUBLIC;
const ZOOMS = {};  // viewBox per piece/view, kept across re-renders
const primalById = id => CUTS.primals.find(p => p.id === id);
const cutById = id => CUTS.cuts.find(c => c.id === id);
// Pieces come from hunt.json; a primal with none (backstrap, tenderloin) is one implicit piece.
function pieces() {
  return CUTS.primals.flatMap(p => {
    const own = (HUNT.pieces || []).filter(x => x.primal === p.id);
    return own.length ? own : [{ id: p.id, primal: p.id, name: p.name, done: p.order.filter(id => DONE.has(id)), views: [], implicit: true }];
  });
}
const pieceById = id => pieces().find(x => x.id === id);
// Next cut: the first one not done after the last one done, so cuts skipped on purpose stay behind you.
function nextCut(piece) {
  const order = primalById(piece.primal).order, d = new Set(piece.done);
  const last = Math.max(-1, ...order.map((id, i) => d.has(id) ? i : -1));
  return order.slice(last + 1).find(id => !d.has(id)) || order.find(id => !d.has(id));
}
const stateOf = (piece, id) => piece.done.includes(id) ? "done" : (piece.in_progress || []).includes(id) ? "prog" : id === nextCut(piece) ? "next" : "later";
const STATE_TAG = { done: `<span class="st ok">done</span>`, prog: `<span class="st pg">in progress</span>`, next: `<span class="st nx">next</span>`, later: "" };
const thread = id => JSON.parse(localStorage.getItem("elk-thread-" + id) || "null") || { thread: null, side: "", msgs: [] };
const saveThread = (id, t) => localStorage.setItem("elk-thread-" + id, JSON.stringify(t));

function show(view) {
  document.querySelectorAll("nav button").forEach(x => x.setAttribute("aria-pressed", x.dataset.view === view));
  document.querySelectorAll("main section").forEach(s => s.hidden = s.id !== view);
  document.body.classList.toggle("has-bar", view === "breakdown" && !!BD);
}

// From the map a primal id comes in: open its first piece that still has cuts left.
function openBreakdown(id) {
  const piece = pieceById(id) || pieces().find(x => x.primal === id && nextCut(x)) || pieces().find(x => x.primal === id);
  if (piece?.id !== BD) { VIEW = 0; SEL = null; TAB = "next"; EDIT = null; speechSynthesis?.cancel() }
  BD = piece?.id || null; renderBreakdown(); show("breakdown"); window.scrollTo({ top: 0 });
  if (BD && localStorage.getItem("elk-awake") !== "0") setAwake(true);  // a tap started this, so it's allowed
}

const ring = (d, n) => `<span class="ring" style="--p:${n ? Math.round(d / n * 100) : 0}%" aria-label="${d} of ${n} cuts done"><b>${d}/${n}</b></span>`;

function renderBreakdown() {
  const all = pieces();
  const picker = `<div class="picker">${all.map(x => {
    const n = primalById(x.primal).order.length, v = (x.views || [])[0];
    return `<button data-q="${x.id}" aria-pressed="${x.id === BD}">${v ? `<img src="${esc(v.img)}" alt="" loading="lazy">` : `<span class="noimg">no photo</span>`}<span class="pn">${esc(x.name)}</span>${ring(x.done.length, n)}</button>`;
  }).join("")}</div>`;
  if (!BD) {
    $("#breakdown").innerHTML = `<h2>Break down a quarter</h2><p class="summary">Pick the piece on the hook. You'll get the next cut on its photo, big steps, and a Done button at the bottom.</p>${picker}`;
    return;
  }
  const piece = pieceById(BD), p = primalById(piece.primal), nx = nextCut(piece);
  $("#breakdown").innerHTML = `${picker}
    <div class="phead"><h2>${esc(piece.name)}</h2><span class="pr">${piece.done.length} of ${p.order.length} cuts done</span>
      <button class="awake" id="awake" aria-pressed="${AWAKE}">${AWAKE ? "🔆 Screen stays on" : "🔅 Keep screen on"}</button></div>
    <div class="seg" role="tablist">${[["next", "Next cut"], ["photos", "Photos"], ["all", "All cuts"], ...(PUBLIC ? [] : [["ask", "Ask Claude"]])]
      .map(([k, l]) => `<button role="tab" data-tab="${k}" aria-selected="${TAB === k}">${l}</button>`).join("")}</div>
    <div id="pane"></div>
    <div class="actionbar">
      ${nx ? `<button class="btn big" data-done="${nx}" data-on="1">✓ Done: ${esc(cutById(nx).name)}</button>`
           : `<button class="btn big ghost" data-logpk="">All cuts done · log packages</button>`}
      ${PUBLIC ? "" : `<label class="btn big ghost cam">📷 Ask<input type="file" accept="image/*" capture="environment" id="quickcam"></label>`}
    </div>`;
  renderPane(); document.body.classList.toggle("has-bar", !$("#breakdown").hidden);
}

function renderPane() {
  const piece = pieceById(BD), p = primalById(piece.primal), nx = nextCut(piece), pane = $("#pane");
  const hasRegion = id => (piece.views || []).some(v => v.regions.some(r => r.cut === id));
  if (TAB === "next") {
    if (!nx) { pane.innerHTML = `<div class="focus"><h3 class="big">Every cut on ${esc(piece.name.toLowerCase())} is done.</h3><p>Log what went in the freezer, then pick the next piece above.</p><button class="btn big" data-logpk="">Log packages</button></div>`; return }
    const c = cutById(nx), i = p.order.indexOf(nx);
    pane.innerHTML = `<div class="focus">
      <p class="pr">Cut ${i + 1} of ${p.order.length}${stateOf(piece, nx) === "prog" ? " · in progress" : ""}</p>
      <h3 class="big">${esc(c.name)}</h3>
      ${"speechSynthesis" in window ? `<button class="btn ghost sm speak" id="speak">🔊 Read it to me</button>` : ""}
      ${hasRegion(nx) ? `<div id="viewer" data-focus="${nx}"></div>` : (piece.views || []).length ? `<p class="aka">This cut isn't outlined on a photo yet. <a href="#" data-tab="photos">See the photos</a>${PUBLIC ? "" : " or tap 📷 Ask"}.</p>` : ""}
      <p class="find"><b>Find it:</b> ${esc(c.find)}</p>
      <ol class="steps">${c.steps.map(x => `<li>${esc(x)}</li>`).join("")}</ol>
      <p class="aka">Pack: ${esc(c.pack)}</p>
    </div>`;
    if (hasRegion(nx)) renderViewer();
  } else if (TAB === "photos") {
    pane.innerHTML = `<div id="viewer"></div>`; renderViewer();
  } else if (TAB === "all") {
    pane.innerHTML = `<p class="summary">${esc(p.summary)}</p>
      <ul class="marks">${p.landmarks.map(l => `<li>${esc(l)}</li>`).join("")}</ul>
      <ol class="order">${p.order.map((id, i) => { const c = cutById(id); if (!c) return ""; const st = stateOf(piece, id);
        return `<li class="${st}" id="step-${id}"><details ${st === "next" || st === "prog" ? "open" : ""}><summary data-sel="${id}"><span class="n">${i + 1}</span>${esc(c.name)}${STATE_TAG[st]}</summary>
          <div class="body"><p><b>Find it:</b> ${esc(c.find)}</p><ol>${c.steps.map(x => `<li>${esc(x)}</li>`).join("")}</ol><p class="aka">${esc(c.pack)}</p>
          <p class="row">${doneButton(piece, id)}<button class="btn ghost sm" data-logpk="${id}">Log packages</button></p></div></details></li>` }).join("")}</ol>`;
  } else {
    const t = thread(piece.id);
    pane.innerHTML = `<div class="chat" id="chat">
      <div id="msgs">${t.msgs.length ? t.msgs.map(renderMsg).join("") : `<p class="empty">Take a photo of the piece on the hook, whole face in frame, good light. Claude finds the landmarks, names the next cut and draws it on your photo. The 📷 button at the bottom sends one straight away.</p>`}</div>
      <form class="composer" id="composer">
        <textarea name="message" rows="2" placeholder="Optional: what you see or want to know (e.g. 'flat iron is off, what next?')"></textarea>
        <input type="text" name="side" placeholder="Anything else? e.g. left side" value="${esc(t.side)}">
        <div class="row">
          <label class="file btn ghost">📷 Photo<input type="file" name="photo" accept="image/*" capture="environment"></label>
          <img class="preview" id="preview" hidden alt="">
          <button class="btn" type="submit">Send</button>
          ${t.msgs.length ? `<button class="btn ghost" type="button" id="newthread">New thread</button>` : ""}
        </div>
      </form></div>`;
  }
}

const doneButton = (piece, id) => piece.done.includes(id)
  ? `<button class="btn ghost sm" data-done="${id}" data-on="0">Undo: not done</button>`
  : `<button class="btn sm" data-done="${id}" data-on="1">Mark done</button>`;

// The photo viewer: the cut-out quarter, each cut outlined and shaded by state. Regions are in the
// photo's own pixels (see tools/cutout.py); the mask trims them to the meat's edge. In the Next cut
// tab it starts zoomed to that cut. Pinch, wheel, double-tap or the +/- buttons zoom; drag pans.
function renderViewer() {
  const box = $("#viewer"); if (!box) return;
  const piece = pieceById(BD), views = piece.views || [], spin = piece.spin?.frames?.length, focus = box.dataset.focus;
  if (!views.length && !spin) {
    box.innerHTML = PUBLIC ? `<div class="viewer novw"><p><b>No example photos of this one yet.</b> Use the steps below; the cut guide's map shows where it sits on the elk.</p></div>` : `<div class="viewer novw"><p><b>No photos of this one yet.</b> When it's on the hook, add a photo of the outside and one of the inside (or a 360 set). Claude outlines the cuts on them for you to check.</p>
      ${piece.implicit ? "" : `<p><button class="btn big" data-addphoto>📷 Add photos</button></p>`}</div>`;
    return;
  }
  let vi = VIEW;
  if (focus) vi = views.findIndex(v => v.regions.some(r => r.cut === focus));
  if (vi !== "spin" && !views[vi]) vi = VIEW = 0;
  const tabs = focus ? "" : `<div class="vtabs">${views.map((v, i) => `<button data-vw="${i}" aria-pressed="${i === vi}">${esc(v.label)}${v.draft ? " •" : ""}</button>`).join("")}${spin ? `<button data-vw="spin" aria-pressed="${vi === "spin"}">360°</button>` : ""}${piece.implicit || PUBLIC ? "" : `<button class="add" data-addphoto>＋ Add photos</button>`}</div>`;
  if (vi === "spin") { box.innerHTML = `<div class="viewer">${tabs}${spinner(piece.spin)}</div>`; wireSpin(); return }
  const v = views[vi], [x, y, w, h] = v.box, fs = Math.round(Math.max(w, h * .6) / 17);
  const editing = !focus && EDIT?.vid === v.id, regs = editing ? EDIT.regions : v.regions;
  const order = primalById(piece.primal).order;
  const pts = r => r.pts.map(q => q.join(",")).join(" ");
  const mid = r => {  // area centroid, so labels sit inside the shape
    let a = 0, cx = 0, cy = 0;
    r.pts.forEach(([x1, y1], i) => { const [x2, y2] = r.pts[(i + 1) % r.pts.length], k = x1 * y2 - x2 * y1; a += k; cx += (x1 + x2) * k; cy += (y1 + y2) * k });
    return [cx / (3 * a), cy / (3 * a)];
  };
  const on = (r, i) => editing ? EDIT.sel === i : SEL && (r.cut ? SEL === r.cut : SEL === "m" + i);
  const shapes = regs.map((r, i) => {
    if (r.type === "cut") return `<polygon points="${pts(r)}" class="vr cut ${stateOf(piece, r.cut)}${on(r, i) || r.cut === focus ? " sel" : ""}" data-sel="${r.cut}" data-ri="${i}" tabindex="0" role="button" aria-label="${esc(cutById(r.cut)?.name)}"/>`;
    if (r.type === "landmark") return `<polygon points="${pts(r)}" class="vr mark${on(r, i) ? " sel" : ""}" data-sel="m${i}" data-ri="${i}" tabindex="0" role="button" aria-label="${esc(r.name)}"/>`;
    return "";
  }).join("");
  const lines = regs.map((r, i) => r.type === "line" ? `<g class="vl${on(r, i) ? " sel" : ""}" data-sel="m${i}" data-ri="${i}" tabindex="0" role="button" aria-label="${esc(r.name)}"><polyline points="${pts(r)}" class="hit"/><polyline points="${pts(r)}" class="ln"/></g>` : "").join("");
  const handles = editing && EDIT.sel != null && regs[EDIT.sel] ? regs[EDIT.sel].pts.map(([hx, hy], j) => `<circle class="hdl" data-pi="${j}" cx="${hx}" cy="${hy}" r="${(w / 40).toFixed(1)}"/>`).join("") : "";
  const seen = new Set();
  const labels = regs.map((r, i) => {
    if (r.type === "line") return "";
    const key = r.cut || "m" + i; if (seen.has(key)) return ""; seen.add(key);
    const [cx, cy] = mid(r), n = order.indexOf(r.cut) + 1, xs = r.pts.map(q => q[0]);
    const full = r.cut ? `${n}. ${cutById(r.cut)?.name}` : r.name;
    const short = r.cut && (piece.done.includes(r.cut) || full.length * fs * .5 > (Math.max(...xs) - Math.min(...xs)) * 1.1);
    const text = short ? String(n) : full;  // done or narrow: number only, tap it for the name
    const lx = Math.min(Math.max(cx, x + text.length * fs * .27), x + w - text.length * fs * .27);
    return `<text class="vt${r.cut ? " " + stateOf(piece, r.cut) : " mk"}" x="${lx}" y="${cy}" font-size="${fs}" text-anchor="middle">${esc(text)}${r.cut && piece.done.includes(r.cut) ? " ✓" : ""}</text>`;
  }).join("");
  // Starting view: the whole photo, or (Next cut) the cut with room around it. Same aspect as the photo.
  let vb = [x, y, w, h];
  if (focus) {
    const ps = regs.filter(r => r.cut === focus).flatMap(r => r.pts), xs = ps.map(q => q[0]), ys = ps.map(q => q[1]);
    // Its own frame shape (between portrait and landscape) so a wide cut on a tall photo still fills it.
    const rw = Math.max(...xs) - Math.min(...xs), rh = Math.max(...ys) - Math.min(...ys);
    const ar = Math.min(Math.max(rw / rh, .75), 1.4);
    let fw = Math.max(rw * 1.5, rh * 1.5 * ar, w * .35), fh = fw / ar;
    if (fh > h) { fh = h; fw = fh * ar }
    const fx = Math.min(Math.max((Math.min(...xs) + Math.max(...xs)) / 2 - fw / 2, x - Math.max(fw - w, 0) / 2), x + Math.max(w - fw, 0));
    const fy = Math.min(Math.max((Math.min(...ys) + Math.max(...ys)) / 2 - fh / 2, y), y + h - fh);
    vb = [fx, fy, fw, fh];
  }
  const zkey = `${BD}/${vi}/${focus ? "f" : "a"}`;
  vb = ZOOMS[zkey] || vb;
  const sw = (w / 200).toFixed(1);
  box.innerHTML = `<div class="viewer">${tabs}
    <div class="stage">
    <svg class="photo${editing ? " editing" : ""}" viewBox="${vb.join(" ")}" data-box="${v.box.join(" ")}" data-zkey="${zkey}" ${editing ? `data-edit="1"` : ""} role="img" aria-label="${esc(piece.name)}, ${esc(v.label)}">
      <defs><mask id="vmask" maskUnits="userSpaceOnUse" x="${x}" y="${y}" width="${w}" height="${h}" style="mask-type:alpha"><image href="${esc(v.img)}" x="${x}" y="${y}" width="${w}" height="${h}"/></mask>
        <pattern id="vhatch" width="${fs * .5}" height="${fs * .5}" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="${fs * .5}" height="${fs * .5}" fill="rgba(90,90,90,.35)"/><line x1="0" y1="0" x2="0" y2="${fs * .5}" stroke="rgba(255,248,238,.85)" stroke-width="${fs * .12}"/></pattern></defs>
      <image href="${esc(v.img)}" x="${x}" y="${y}" width="${w}" height="${h}"/>
      <g mask="url(#vmask)" style="--sw:${sw}px">${shapes}</g><g style="--sw:${sw}px">${lines}</g>${labels}${handles}
    </svg>
    <div class="zbtns"><button data-zoom="in" aria-label="Zoom in">+</button><button data-zoom="out" aria-label="Zoom out">−</button><button data-zoom="fit" aria-label="Whole photo">⤢</button></div>
    </div>
    ${editing ? editBar(piece, regs) : focus ? "" : v.draft ? draftBar(v) : ""}
    ${focus || editing ? "" : `<div class="vkey"><span><i class="k next"></i>next</span><span><i class="k prog"></i>in progress</span><span><i class="k done"></i>done</span><span><i class="k later"></i>later</span><span><i class="k mark"></i>leave on</span><span><i class="k line"></i>cut line / landmark</span></div>`}
    <p class="aka">${PUBLIC ? "Example photo from a 2026 bull elk; yours will look close to this. " : ""}${focus ? "" : esc(v.caption || "") + (v.caption ? ". " : "")}Outlines are drawn by eye: confirm by feel before you cut. Pinch or double-tap to zoom.</p>
    ${focus || editing ? "" : `<div id="vinfo" aria-live="polite">${info(piece, v)}</div>`}
    ${focus || editing || v.draft || piece.implicit || PUBLIC ? "" : `<p class="vmanage"><a href="#" data-vact="edit">Fix outlines</a> · <a href="#" data-vact="redraw">Have Claude redraw them</a> · <a href="#" data-vact="delete">Delete this photo</a></p>`}</div>`;
  wireZoom($("svg.photo", box));
  if (editing) wireEdit($("svg.photo", box));
}

// Pan and zoom by rewriting the viewBox, kept to the photo's box and aspect.
function wireZoom(svg) {
  const [bx, by, bw, bh] = svg.dataset.box.split(" ").map(Number), zkey = svg.dataset.zkey;
  let vb = svg.getAttribute("viewBox").split(" ").map(Number);
  const ar = vb[2] / vb[3];
  const maxW = Math.max(bw, bh * ar);  // zoomed all the way out, the whole photo fits the frame
  const fit = () => { vb = [bx + (bw - maxW) / 2, by + (bh - maxW / ar) / 2, maxW, maxW / ar]; apply() };
  const clampAxis = (pos, size, b0, bsize) => size >= bsize ? b0 + (bsize - size) / 2 : Math.min(Math.max(pos, b0), b0 + bsize - size);
  const apply = () => {
    vb[2] = Math.min(Math.max(vb[2], bw / 8), maxW); vb[3] = vb[2] / ar;
    vb[0] = clampAxis(vb[0], vb[2], bx, bw); vb[1] = clampAxis(vb[1], vb[3], by, bh);
    svg.setAttribute("viewBox", vb.join(" ")); ZOOMS[zkey] = [...vb];
    svg.style.touchAction = svg.dataset.edit || vb[2] < bw * .98 || vb[3] < bh * .98 ? "none" : "pan-y";  // zoomed in: one finger pans the photo
  };
  const toSvg = (cx, cy) => { const r = svg.getBoundingClientRect(); return [vb[0] + (cx - r.left) / r.width * vb[2], vb[1] + (cy - r.top) / r.height * vb[3]] };
  const zoomAt = (px, py, f) => { const nw = Math.min(Math.max(vb[2] / f, bw / 8), maxW); vb[0] = px - (px - vb[0]) * nw / vb[2]; vb[1] = py - (py - vb[1]) * nw / vb[2]; vb[2] = nw; apply() };
  apply();
  svg.addEventListener("wheel", e => { e.preventDefault(); const [px, py] = toSvg(e.clientX, e.clientY); zoomAt(px, py, e.deltaY < 0 ? 1.2 : 1 / 1.2) }, { passive: false });
  svg.addEventListener("dblclick", e => { e.preventDefault(); const [px, py] = toSvg(e.clientX, e.clientY); if (vb[2] < bw / 3) fit(); else zoomAt(px, py, 2) });
  const pts = new Map(); let last = null, moved = 0;
  svg.addEventListener("pointerdown", e => { pts.set(e.pointerId, [e.clientX, e.clientY]); moved = 0; last = null; delete svg.dataset.dragged });
  svg.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pts.size === 2) {
      const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]), m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
      if (last) { const [px, py] = toSvg(...m); zoomAt(px, py, d / last) }
      last = d; moved += 10;
    } else if (pts.size === 1 && svg.style.touchAction === "none" && !svg.dataset.dragging) {
      const r = svg.getBoundingClientRect(), dx = e.clientX - prev[0], dy = e.clientY - prev[1];
      vb[0] -= dx / r.width * vb[2]; vb[1] -= dy / r.height * vb[3]; moved += Math.abs(dx) + Math.abs(dy); apply();
    }
    if (moved > 8) svg.dataset.dragged = "1";
  });
  const up = e => { pts.delete(e.pointerId); last = null };
  svg.addEventListener("pointerup", up); svg.addEventListener("pointercancel", up);
  svg.closest(".stage").querySelector(".zbtns").addEventListener("click", e => {
    const z = e.target.dataset.zoom; if (!z) return;
    if (z === "fit") return fit();
    zoomAt(vb[0] + vb[2] / 2, vb[1] + vb[3] / 2, z === "in" ? 1.6 : 1 / 1.6);
  });
}

function info(piece, v) {
  if (!SEL) return `<p class="empty">Tap an outlined cut or a line for what it is.</p>`;
  if (/^m\d+$/.test(SEL)) { const r = v.regions[+SEL.slice(1)]; return r ? `<div class="vcard"><h3>${esc(r.name)}</h3><p>${esc(r.note || "")}</p></div>` : "" }
  const c = cutById(SEL), st = stateOf(piece, SEL); if (!c) return "";
  return `<div class="vcard"><h3>${esc(c.name)} ${STATE_TAG[st]}</h3><p><b>Find it:</b> ${esc(c.find)}</p>
    <div>${c.uses.map(u => `<span class="tag">${esc(u)}</span>`).join("")}</div>
    <p class="row"><a href="#" data-steps="${c.id}">Steps</a> ${doneButton(piece, c.id)}</p></div>`;
}

// Select a cut or landmark; if this view doesn't show the cut, switch to one that does.
function select(id, keep = false) {
  SEL = SEL === id && !keep ? null : id;
  const views = pieceById(BD).views || [];
  if (SEL && !/^m\d+$/.test(SEL) && VIEW !== "spin" && !views[VIEW]?.regions.some(r => r.cut === SEL)) {
    const i = views.findIndex(v => v.regions.some(r => r.cut === SEL)); if (i >= 0) VIEW = i;
  }
  renderViewer();
}

// 360: frames shot every 30° or so; drag (or use the slider) to turn the quarter.
function spinner(sp) {
  sp = { ...sp, frames: sp.frames.filter(Boolean) };
  return `<div class="spin" tabindex="0" aria-label="Drag to turn the quarter"><img src="${esc(sp.frames[0])}" alt="Quarter, turned" draggable="false"></div>
    <input type="range" class="spinr" min="0" max="${sp.frames.length - 1}" value="0" aria-label="Turn">
    <p class="aka">Drag the photo or the slider to turn it.</p>`;
}
function wireSpin() {
  const sp = { frames: pieceById(BD).spin.frames.filter(Boolean) }, el = $(".spin"), img = $("img", el), r = $(".spinr"), n = sp.frames.length;
  sp.frames.forEach(f => { new Image().src = f });
  let i = 0, x0 = null, i0 = 0;
  const go = k => { i = ((k % n) + n) % n; img.src = sp.frames[i]; r.value = i };
  el.addEventListener("pointerdown", e => { x0 = e.clientX; i0 = i; el.setPointerCapture(e.pointerId) });
  el.addEventListener("pointermove", e => { if (x0 !== null) go(i0 + Math.round((e.clientX - x0) / (el.clientWidth / n / 1.5))) });
  el.addEventListener("pointerup", () => { x0 = null });
  el.addEventListener("keydown", e => { if (e.key === "ArrowRight") go(i + 1); if (e.key === "ArrowLeft") go(i - 1) });
  r.addEventListener("input", () => go(+r.value));
}


// ---- Photos: add them, check Claude's drafted outlines, fix them by dragging the corners.
let EDIT = null;  // { vid, regions (a copy), sel, dirty } while fixing one photo's outlines
const draftBar = v => `<div class="draft"><p><b>Claude drafted these outlines.</b> Check them against the meat before you trust them.</p>
  ${v.unsure ? `<details><summary>What Claude wasn't sure about</summary><p>${esc(v.unsure)}</p></details>` : ""}
  <div class="row"><button class="btn sm" data-vact="approve">✓ Looks right</button><button class="btn ghost sm" data-vact="edit">Fix outlines</button><button class="btn ghost sm" data-vact="redraw">Redraw</button><button class="btn ghost sm" data-vact="delete">Delete photo</button></div></div>`;
function editBar(piece, regs) {
  const r = EDIT.sel != null ? regs[EDIT.sel] : null, order = primalById(piece.primal).order;
  return `<div class="editbar">${r ? `<p><b>Drag the dots</b> to move this outline's corners.</p>
      ${r.type === "cut" ? `<label>This is<select id="ecut">${order.map(id => `<option value="${id}" ${id === r.cut ? "selected" : ""}>${esc(cutById(id)?.name)}</option>`).join("")}</select></label>`
                         : `<label>Name<input id="ename" value="${esc(r.name || "")}"></label>`}
      <p class="row"><button class="btn ghost sm" data-eact="remove">Delete this outline</button><button class="btn ghost sm" data-eact="none">Pick another</button></p>`
    : `<p><b>Tap an outline</b> to move its corners. Zoom in (+ or pinch) for small ones.</p>`}
    <p class="row"><button class="btn sm" data-eact="save">Save outlines</button><button class="btn ghost sm" data-eact="cancel">Cancel</button></p></div>`;
}
function wireEdit(svg) {
  const toSvg = (cx, cy) => { const q = new DOMPoint(cx, cy).matrixTransform(svg.getScreenCTM().inverse()); return [Math.round(q.x), Math.round(q.y)] };
  svg.querySelectorAll(".hdl").forEach(h => {
    h.addEventListener("pointerdown", e => { e.stopPropagation(); e.preventDefault(); h.setPointerCapture(e.pointerId); svg.dataset.dragging = "1" });
    h.addEventListener("pointermove", e => {
      if (!h.hasPointerCapture(e.pointerId)) return; e.stopPropagation();
      const [x, y] = toSvg(e.clientX, e.clientY), r = EDIT.regions[EDIT.sel], pts = r.pts.map(q => q.join(",")).join(" ");
      r.pts[+h.dataset.pi] = [x, y]; h.setAttribute("cx", x); h.setAttribute("cy", y); EDIT.dirty = true;
      svg.querySelectorAll(`polygon[data-ri="${EDIT.sel}"], g[data-ri="${EDIT.sel}"] polyline`).forEach(el => el.setAttribute("points", r.pts.map(q => q.join(",")).join(" ")));
    });
    const end = () => { delete svg.dataset.dragging; svg.dataset.dragged = "1" };  // so letting go isn't taken as a tap
    h.addEventListener("pointerup", end); h.addEventListener("pointercancel", end);
  });
}

async function post(path, body) {  // no offline queue: photos and outline edits need the network
  const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const r = await res.json().catch(() => ({})); if (!res.ok) throw new Error(r.error || res.statusText); return r;
}
const JOB_TEXT = { queued: "Waiting…", "cutting out": "Removing the background…", outlining: "Claude is drawing the outlines (about 30 seconds)…", done: "✓ Ready", error: "✗ " };
async function pollJob(id, onState) {
  for (;;) {
    const j = await fetch("api/job/" + id).then(r => r.json()); onState(j);
    if (j.state === "done" || j.state === "error") return j;
    await new Promise(ok => setTimeout(ok, 2000));
  }
}
const currentView = () => (pieceById(BD).views || [])[VIEW];

async function viewAction(act) {
  const v = currentView(); if (!v) return;
  try {
    if (act === "edit") { EDIT = { vid: v.id, regions: structuredClone(v.regions), sel: null, dirty: false }; return renderViewer() }
    if (act === "approve") { await post("api/view", { piece: BD, view: v.id, action: "approve" }); toast("Outlines checked."); return load() }
    if (act === "delete") { if (!confirm(`Remove the "${v.label}" photo from ${pieceById(BD).name}?`)) return; await post("api/view", { piece: BD, view: v.id, action: "delete" }); VIEW = 0; return load() }
    if (act === "redraw") {
      const note = prompt("What should Claude fix? (optional, e.g. 'the clod is higher, by the elbow')", ""); if (note === null) return;
      const { job } = await post("api/view", { piece: BD, view: v.id, action: "redraw", note });
      toast("Claude is redrawing the outlines (about 30 seconds)…");
      const j = await pollJob(job, () => {}); if (j.state === "error") throw new Error(j.error);
      toast("New outlines drafted. Check them."); return load();
    }
  } catch (e) { alert("Didn't work: " + e.message) }
}
async function editAction(act) {
  if (act === "remove") { EDIT.regions.splice(EDIT.sel, 1); EDIT.sel = null; EDIT.dirty = true }
  if (act === "none") EDIT.sel = null;
  if (act === "cancel") { if (EDIT.dirty && !confirm("Throw away your changes to these outlines?")) return; EDIT = null }
  if (act === "save") {
    try { await post("api/view", { piece: BD, view: EDIT.vid, action: "save", regions: EDIT.regions }); EDIT = null; toast("Outlines saved."); return load() }
    catch (e) { return alert("Couldn't save: " + e.message) }
  }
  renderViewer();
}

function photoSheet() {
  const piece = pieceById(BD), d = $("#sheet"); d.onclose = null;
  const kinds = [["Outside", "Outside face"], ["Inside", "Inside face"], ["Other", "Something else"], ["360", "360° set"]];
  const help = { Outside: "One photo of the whole outside face, good light, about 6 feet back.", Inside: "One photo of the whole inside face, good light, about 6 feet back.",
    Other: "Any other view, e.g. after a cut came off.", "360": "Take about 12 photos with the camera, turning the piece a little each time, then pick them all here in order." };
  d.innerHTML = `<form method="dialog" id="addform"><h3>Add photos: ${esc(piece.name)}</h3>
    <div class="kinds">${kinds.map(([k, l], i) => `<label><input type="radio" name="kind" value="${k}" ${i ? "" : "checked"}><span>${l}</span></label>`).join("")}</div>
    <label id="otherlbl" hidden>Call it<input name="label" placeholder="e.g. After the flat iron"></label>
    <p class="aka" id="kindhelp">${help.Outside}</p>
    <div class="row"><label class="btn big" id="camlbl">📷 Take photo<input type="file" accept="image/*" capture="environment" name="cam" hidden></label>
      <label class="btn big ghost">🖼 Pick photos<input type="file" accept="image/*" multiple name="pick" hidden></label></div>
    <ol id="jobs" class="jobs"></ol>
    <div class="row sh-btns"><button class="btn big ghost" value="close">Close</button></div></form>`;

// ---- Saving: POST to the API; if the Wi-Fi is down, apply it here, queue it, and send it later.
const QKEY = "elk-queue";
const queue = () => JSON.parse(localStorage.getItem(QKEY) || "[]");
function applyLocal(path, body) {
  if (path === "api/done") {
    const p = (HUNT.pieces || []).find(x => x.id === body.piece);
    if (p) { p.done = p.done.filter(c => c !== body.cut).concat(body.done ? [body.cut] : []); p.in_progress = (p.in_progress || []).filter(c => c !== body.cut) }
    const still = body.done || (HUNT.pieces || []).some(x => x.done.includes(body.cut));
    HUNT.done_cuts = (HUNT.done_cuts || []).filter(c => c !== body.cut).concat(still ? [body.cut] : []);
  }
  if (path === "api/log") LOG.push(body);
}
async function api(path, body) {
  if (PUBLIC) { applyLocal(path, body); saveMine(); return {} }
  try {
    const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const r = await res.json().catch(() => ({}));
    if (!res.ok) throw Object.assign(new Error(r.error || res.statusText), { server: true });
    return r;
  } catch (e) {
    if (e.server) throw e;
    localStorage.setItem(QKEY, JSON.stringify([...queue(), { path, body }]));
    applyLocal(path, body); netBanner(); return { queued: true };
  }
}
async function flush() {
  let q = queue(); if (!q.length) return;
  while (q.length) {
    try { const res = await fetch(q[0].path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(q[0].body) }); if (!res.ok && res.status < 500) console.warn("dropped", q[0], res.status) }
    catch { break }
    q = q.slice(1); localStorage.setItem(QKEY, JSON.stringify(q));
  }
  netBanner(); if (!q.length) load().catch(() => {});
}
function netBanner(offline) {
  const n = queue().length, el = $("#net");
  el.hidden = !n && !offline;
  el.textContent = n ? `Offline: ${n} change${n > 1 ? "s" : ""} saved on this phone, sending when the Wi-Fi is back.` : "Offline: showing the last saved data.";
}
if (!PUBLIC) { addEventListener("online", flush); setInterval(flush, 20000) }

}

function shrink(file, max = 1600) {
  return new Promise((ok, bad) => {
    const img = new Image(); img.onerror = () => bad(new Error("Could not read that photo"));
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), cv = document.createElement("canvas");
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(img.src); ok(cv.toDataURL("image/jpeg", .85));
    };
    img.src = URL.createObjectURL(file);
  });
}

const KINDS = [["Steaks", /steak|filet/i], ["Roasts", /roast|tender/i], ["Grind", /grind|trim|burger/i], ["Stew and other", /./]];
function freezer(log) {
  const by = KINDS.map(([k]) => ({ k, lb: 0, pk: 0, rows: 0, unweighed: 0 }));
  log.forEach(r => {
    const i = KINDS.findIndex(([, re]) => re.test(r.cut)), b = by[i], lb = parseFloat(r.total_lb);
    b.rows++; b.pk += parseInt(r.packages) || 0; if (lb) b.lb += lb; else b.unweighed++;
  });
  const used = by.filter(b => b.rows), max = Math.max(1, ...used.map(b => b.lb));
  return `<div class="bars" role="table" aria-label="Pounds in the freezer by kind of cut">${used.map(b => `
    <div class="bar" role="row" title="${b.k}: ${b.lb.toFixed(1)} lb in ${b.pk} package${b.pk === 1 ? "" : "s"}${b.unweighed ? `, ${b.unweighed} entr${b.unweighed === 1 ? "y" : "ies"} not weighed` : ""}">
      <span role="rowheader">${b.k}</span><span class="track"><i style="width:${(b.lb / max * 100).toFixed(1)}%"></i></span>
      <span role="cell" class="val">${b.lb ? b.lb.toFixed(1) + " lb" : "not weighed"} · ${b.pk} pkg${b.unweighed && b.lb ? " +" : ""}</span></div>`).join("")}</div>
    ${used.some(b => b.unweighed) ? `<p class="aka">"+" or "not weighed": some packages were logged without a weight.</p>` : ""}`;
}

let CUTS_RAW;
function render(cuts, hunt, log) {
  const done = new Set([...(hunt.done_cuts || []), ...(hunt.pieces || []).flatMap(x => x.done)]);  // on any side
  CUTS = CUTS_RAW = cuts; DONE = done; HUNT = hunt; LOG = log;
  const photosFor = id => hunt.photos.filter(p => (p.cuts || []).includes(id));
  // Cut guide: the map, then each primal with its cut cards folded away until asked for.
  const openCards = new Set([...document.querySelectorAll("#guide details.pcards[open]")].map(d => d.dataset.p));
  $("#guide").innerHTML = elkMap(cuts, done) + cuts.primals.map(p => {
    const list = p.order.map(id => cuts.cuts.find(c => c.id === id)).filter(Boolean);
    return `<h2>${esc(p.name)}</h2><p class="summary">${esc(p.summary)}</p>
      <details class="pcards" data-p="${p.id}" ${openCards.has(p.id) ? "open" : ""}><summary>${list.length} cut${list.length > 1 ? "s" : ""}: ${list.map(c => esc(c.name.toLowerCase())).join(", ")}</summary>
      <ul class="marks">${p.landmarks.map(l => `<li>${esc(l)}</li>`).join("")}</ul>
      <div class="cuts">${list.map((c, i) => `<article class="cut" id="cut-${c.id}">
        <h3><span class="n">${i + 1}</span>${esc(c.name)}</h3>
        ${c.aka ? `<div class="aka">${c.aka.map(esc).join(" · ")}</div>` : ""}
        <p><b>Find it:</b> ${esc(c.find)}</p>
        <ol>${c.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol>
        <div>${c.uses.map(u => `<span class="tag">${esc(u)}</span>`).join("")}${done.has(c.id) ? `<span class="tag done">done${PUBLIC ? "" : " 2026"}</span>` : ""}</div>
        <p class="aka">${esc(c.pack)}</p>
        ${photosFor(c.id).length ? `<div class="thumbs">${photosFor(c.id).map(ph => `<img loading="lazy" src="${esc(ph.file)}" alt="${esc(ph.caption)}" title="${esc(ph.caption)}">`).join("")}</div>` : ""}
      </article>`).join("")}</div></details>`;
  }).join("");

  const lb = log.reduce((s, r) => s + (parseFloat(r.total_lb) || 0), 0);
  const pk = log.reduce((s, r) => s + (parseInt(r.packages) || 0), 0);
  const nCuts = pieces().reduce((s, x) => s + primalById(x.primal).order.length, 0), nDone = pieces().reduce((s, x) => s + x.done.length, 0);
  const cols = ["date", "source", "cut", "packages", "package_size", "total_lb", "notes"];
  if (PUBLIC) $("#hunt").innerHTML = `<h2>My freezer</h2>
    <p class="summary">Kept on this phone only. Every cut you mark done and every package you log shows up here.</p>
    <div class="tiles">
      <div class="tile"><b>${lb.toFixed(1)}</b><span>lb weighed</span></div>
      <div class="tile"><b>${pk}</b><span>packages</span></div>
      <div class="tile"><b>${nDone}<small>/${nCuts}</small></b><span>cuts done</span></div>
      <div class="tile"><b>${pieces().filter(x => nextCut(x)).length}</b><span>pieces left</span></div>
    </div>
    ${log.length ? `<h2>In the freezer</h2>${freezer(log)}
    <details class="pcards"><summary>Freezer log, every entry (${log.length})</summary>
    <div class="table-wrap"><table><thead><tr>${cols.map(c => `<th>${c.replace("_", " ")}</th>`).join("")}</tr></thead>
    <tbody>${log.map(r => `<tr>${cols.map(c => `<td class="${["packages", "total_lb"].includes(c) ? "num" : ""}">${esc(r[c])}</td>`).join("")}</tr>`).join("")}</tbody></table></div></details>
    <p class="row"><button class="btn sm" id="toai">Send to my AI (Dremur)</button><button class="btn ghost sm" id="csv">Download the log (spreadsheet)</button></p>
    <p class="aka">Send to my AI hands the log to Claude (or another assistant) with a note asking it to save the rows to Dremur, if you've connected Dremur to it. It sends only what you choose to share.</p>` : `<p class="aka">Nothing logged yet. After you mark a cut done you can log its packages.</p>`}
    <h2>Quarters</h2><div class="plist">${pieces().map(x => { const n = primalById(x.primal).order.length, nx = nextCut(x);
      return `<a href="#" data-q="${x.id}" class="prow">${ring(x.done.length, n)}<span><b>${esc(x.name)}</b><small>${nx ? `next: ${esc(cutById(nx)?.name.toLowerCase())}` : "all done"}</small></span></a>` }).join("")}</div>
    <h2>Lessons</h2><ul class="marks">${hunt.lessons.map(r => `<li>${esc(r)}</li>`).join("")}</ul>
    <p class="row"><button class="btn ghost sm" id="reset">Start a new animal (clear this phone)</button></p>`;
  else $("#hunt").innerHTML = `<h2>${esc(hunt.title)}</h2>
    <p class="summary">Harvested ${esc(new Date(hunt.harvested).toLocaleString([], { weekday: "long", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }))} · ${esc(hunt.tag)}</p>
    <div class="tiles">
      <div class="tile"><b>${lb.toFixed(1)}</b><span>lb weighed</span></div>
      <div class="tile"><b>${pk}</b><span>packages</span></div>
      <div class="tile"><b>${nDone}<small>/${nCuts}</small></b><span>cuts done</span></div>
      <div class="tile"><b>${pieces().filter(x => nextCut(x)).length}</b><span>pieces left</span></div>
    </div>
    <h2>In the freezer</h2>${freezer(log)}
    <details class="pcards"><summary>Freezer log, every entry (${log.length})</summary>
    <div class="table-wrap"><table><thead><tr>${cols.map(c => `<th>${c.replace("_", " ")}</th>`).join("")}</tr></thead>
    <tbody>${log.map(r => `<tr>${cols.map(c => `<td class="${["packages", "total_lb"].includes(c) ? "num" : ""}">${esc(r[c])}</td>`).join("")}</tr>`).join("")}</tbody></table></div></details>
    <h2>Quarters</h2><div class="plist">${pieces().map(x => { const n = primalById(x.primal).order.length, nx = nextCut(x);
      return `<a href="#" data-q="${x.id}" class="prow">${ring(x.done.length, n)}<span><b>${esc(x.name)}</b><small>${nx ? `next: ${esc(cutById(nx)?.name.toLowerCase())}` : "all done"}${(x.in_progress || []).length ? ` · in progress: ${x.in_progress.map(id => esc(cutById(id)?.name || id).toLowerCase()).join(", ")}` : ""}</small></span></a>` }).join("")}</div>
    <h2>Day by day</h2>${(hunt.progress || []).map(d => `<h3 class="day">${esc(new Date(d.date + "T12:00").toLocaleDateString([], { weekday: "long", month: "short", day: "numeric" }))}</h3>
      <ul class="marks">${d.done.map(x => `<li>✓ ${esc(x)}</li>`).join("")}${(d.in_progress || []).map(x => `<li>… ${esc(x)}</li>`).join("")}</ul>`).join("")}
    <h2>Lessons</h2><ul class="marks">${hunt.lessons.map(r => `<li>${esc(r)}</li>`).join("")}</ul>
    <h2>Handling</h2><ul class="marks">${hunt.handling.map(r => `<li>${esc(r)}</li>`).join("")}</ul>
    <h2>Photos</h2><div class="gallery">${hunt.photos.map(p => `<figure><img loading="lazy" class="${p.file.endsWith(".webp") ? "cutout" : ""}" src="${esc(p.file)}" alt="${esc(p.caption)}"><figcaption>${esc(p.caption)}</figcaption></figure>`).join("")}</div>`;
  if (BD || $("#breakdown").innerHTML) renderBreakdown(); else $("#breakdown").innerHTML = "";
  wireMap(cuts, done);
  document.querySelectorAll("#guide img, #hunt img").forEach(img => img.addEventListener("click", () => zoom(img.src)));
}

document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => { if (b.dataset.view === "breakdown" && !BD) renderBreakdown(); show(b.dataset.view) }));

$("#hunt").addEventListener("click", e => {
  const q = e.target.closest("[data-q]"); if (q) { e.preventDefault(); openBreakdown(q.dataset.q) }
  if (e.target.id === "csv") downloadLog();
  if (e.target.id === "toai") sendToAI();
  if (e.target.id === "reset" && confirm("Clear every done cut and the whole freezer log from this phone? Download the log first if you want to keep it.")) { localStorage.removeItem(MKEY); BD = null; load() }
});

// The installed app runs over https (see setup.html); on the plain http address, point to the setup.
if (isSecureContext && "serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
else if (location.protocol === "http:" && !/^(localhost|127\.)/.test(location.hostname)) $("#install").hidden = false;
if (PUBLIC) {
  $(".sub").textContent = "Cut guide, quarter-by-quarter breakdown and freezer log for elk. Hang it, find the landmark, make one cut at a time.";
  $("nav [data-view=hunt]").textContent = "My freezer";
  const inst = $("#install"), standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  let prompt = null;
  const paint = () => {
    const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
    inst.innerHTML = [standalone ? "" : prompt ? `📱 <a href="#" id="inst">Install the app</a>: home screen, works without signal.` : ios ? "📱 To install: tap Share, then <b>Add to Home Screen</b>." : "",
      navigator.share ? `<a href="#" id="share">Share this app</a>` : ""].filter(Boolean).join(" · ");
    inst.hidden = !inst.innerHTML;
  };
  addEventListener("beforeinstallprompt", e => { e.preventDefault(); prompt = e; paint() });
  inst.addEventListener("click", async e => {
    e.preventDefault();
    if (e.target.id === "inst" && prompt) { prompt.prompt(); await prompt.userChoice; prompt = null; paint() }
    if (e.target.id === "share") navigator.share({ title: "Elk Butchering 101", text: "Elk cut guide and breakdown, step by step.", url: location.origin + location.pathname }).catch(() => {});
  });
  paint();
}

// Loaded again after "mark done", so the map, counts and order all update. The last good copy is kept
// on the phone, so the page still works if the garage Wi-Fi drops.
const CKEY = "elk-cache";
const load = () => PUBLIC ? Promise.all([
  fetch("data/cuts.json", { cache: "no-cache" }).then(r => r.json()),
  fetch("data/example.json", { cache: "no-cache" }).then(r => r.json()),
]).then(([c, h]) => { localStorage.setItem(CKEY, JSON.stringify({ c, h })); render(c, h, applyMine(h)) }) : Promise.all([
  fetch("data/cuts.json", { cache: "no-cache" }).then(r => r.json()),
  fetch("data/hunts/2026-elk/hunt.json", { cache: "no-cache" }).then(r => r.json()),
  fetch("data/hunts/2026-elk/freezer-log.csv", { cache: "no-cache" }).then(r => r.text()).then(parseCSV),
]).then(([c, h, l]) => {
  localStorage.setItem(CKEY, JSON.stringify({ c, h, l }));
  applyQueued(h, l);  // changes still waiting to be sent
  render(c, h, l); netBanner();
});
function applyQueued(h, l) { HUNT = h; LOG = l; queue().forEach(x => applyLocal(x.path, x.body)) }
load().catch(e => {
  const c = JSON.parse(localStorage.getItem(CKEY) || "null");
  if (!c) { $("#guide").textContent = "Could not load data: " + e.message; return }
  if (PUBLIC) return render(c.c, c.h, applyMine(c.h));
  applyQueued(c.h, c.l); render(c.c, c.h, c.l); netBanner(true);
});
</script>
</body>
</html>
