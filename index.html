<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elk Butchering 101</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root { --bg:#efe6d6; --card:#f8f2e7; --ink:#2a2420; --muted:#6f6357; --rule:#d6c8b2; --accent:#9b2a1f; --accent-soft:#f1d9d3; --ok:#4f6b3a; color-scheme: light }
@media (prefers-color-scheme: dark) { :root { --bg:#1c1916; --card:#26221e; --ink:#ece3d6; --muted:#a8998a; --rule:#3d362f; --accent:#e0705f; --accent-soft:#3a2420; --ok:#9cbc80; color-scheme: dark } }
* { box-sizing: border-box }
body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.55 "Source Serif 4", Georgia, serif }
header, main { max-width: 960px; margin: 0 auto; padding-left:max(16px, env(safe-area-inset-left)); padding-right:max(16px, env(safe-area-inset-right)) }
header { padding-block: 28px 8px; border-bottom: 3px double var(--rule) }
h1, h2, h3, nav button, .tag { font-family: Oswald, "Arial Narrow", sans-serif; letter-spacing: .02em }
h1 { margin:0; font-size: 2.2rem; text-transform: uppercase } h1 span { color: var(--accent) }
.sub { margin: 2px 0 14px; color: var(--muted) }
nav { display:flex; gap:8px; flex-wrap:wrap }
nav button { border:1px solid var(--rule); background:var(--card); color:var(--ink); padding:8px 14px; font-size:1rem; text-transform:uppercase; cursor:pointer; border-radius:2px }
nav button[aria-pressed=true] { background:var(--accent); border-color:var(--accent); color:var(--card) }
main { padding-block: 20px 60px }
h2 { font-size:1.5rem; text-transform:uppercase; margin: 28px 0 4px; border-bottom: 2px solid var(--ink); padding-bottom: 2px }
.summary { color: var(--muted); margin: 6px 0 10px; max-width: 65ch }
ul.marks { margin: 0 0 14px; padding-left: 20px } ul.marks li { margin: 2px 0 }
.cuts { display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap:14px }
.cut { background:var(--card); border:1px solid var(--rule); border-left: 5px solid var(--accent); padding: 12px 14px; min-width:0 }
.cut h3 { margin:0; font-size:1.25rem; text-transform: uppercase; display:flex; gap:8px; align-items:baseline }
.cut .n { color: var(--accent) }
.aka { color: var(--muted); font-style: italic; font-size: .9rem }
.cut ol { padding-left: 20px; margin: 8px 0 } .cut p { margin: 6px 0 }
.tag { display:inline-block; font-size:.8rem; text-transform:uppercase; background:var(--accent-soft); color:var(--accent); padding:1px 7px; margin: 2px 4px 0 0; border-radius:2px }
.tag.done { background: transparent; border:1px solid var(--ok); color: var(--ok) }
.thumbs { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px } .thumbs img { width: 84px; height: 112px; object-fit: cover; border:1px solid var(--rule); cursor: zoom-in }
.table-wrap { overflow-x:auto; border:1px solid var(--rule); background: var(--card) }
table { border-collapse: collapse; width:100%; font-size:.95rem } th, td { padding: 6px 10px; border-bottom: 1px solid var(--rule); text-align:left; white-space: nowrap }
th { font-family: Oswald, sans-serif; text-transform: uppercase; font-weight:500; color: var(--muted) } td.num { text-align:right; font-variant-numeric: tabular-nums }
.stats { display:flex; gap:24px; flex-wrap:wrap; margin: 10px 0 16px } .stats b { display:block; font: 600 2rem Oswald, sans-serif; color: var(--accent) }
.gallery { display:grid; grid-template-columns: repeat(auto-fill, minmax(180px,1fr)); gap:12px } .gallery figure { margin:0 } .gallery img { width:100%; aspect-ratio: 3/4; object-fit: cover; border:1px solid var(--rule); cursor: zoom-in }
figcaption { font-size:.85rem; color: var(--muted) }
dialog { border:none; padding:0; background:transparent; max-width: 96vw } dialog img { max-height: 92vh; max-width: 96vw; display:block } dialog::backdrop { background: rgba(0,0,0,.8) }

/* elk map */
.map { display:grid; grid-template-columns: minmax(0,1fr) 270px; gap:16px; margin: 18px 0 8px; background:var(--card); border:1px solid var(--rule); padding:14px }
@media (max-width: 760px) { .map { grid-template-columns: 1fr } }
.map svg { width:100%; height:auto; display:block; touch-action: manipulation }
.map .rg { cursor:pointer; stroke: var(--card); stroke-width: 2.5; transition: filter .15s }
.map .rg:hover, .map .rg:focus { filter: brightness(1.18) saturate(1.1); outline: none }
.map .done { fill: url(#hatch); pointer-events: none }
.map .lbl { font: 600 17px Oswald, sans-serif; letter-spacing: .05em; text-transform: uppercase; pointer-events: none }
.map .in { fill:#fff8ee; paint-order: stroke; stroke: rgba(40,15,10,.55); stroke-width: 3.5px }
.map .co { cursor:pointer } .map .co text { fill: var(--ink) } .map .co line { stroke: var(--muted); stroke-width: 1.5 } .map .co circle { fill: var(--ink) }
.map .co:hover text, .map .co.on text { fill: var(--accent) }
.map #hl { fill:none; stroke: var(--ink); stroke-width: 4; pointer-events:none; stroke-linejoin: round }
.map .key { font-size:.85rem; color:var(--muted); margin-top:6px; display:flex; gap:14px; flex-wrap:wrap; align-items:center }
.map .key label { cursor:pointer }
.panel h3 { margin:0; font-size:1.4rem; text-transform:uppercase } .panel .pr { color:var(--muted); font: 500 .85rem Oswald, sans-serif; text-transform:uppercase; letter-spacing:.05em }
.panel p { margin: 6px 0 } .panel ul { padding-left: 18px; margin: 6px 0 }
.panel a { color: var(--accent) }
.progress { height:8px; background: var(--rule); border-radius: 4px; overflow:hidden; margin: 6px 0 2px } .progress i { display:block; height:100%; background: var(--ok) }
.cut.flash { outline: 3px solid var(--accent); outline-offset: 2px; transition: outline-color 1.5s }
</style>
</head>
<body>
<header>
  <h1>Elk Butchering <span>101</span></h1>
  <p class="sub">Cut guide and freezer log, Kohl family. Hang it, find the landmark, make one cut at a time.</p>
  <nav><button data-view="guide" aria-pressed="true">Cut guide</button><button data-view="hunt" aria-pressed="false">2026 elk</button></nav>
</header>
<main>
  <section id="guide"></section>
  <section id="hunt" hidden></section>
</main>
<dialog id="zoom"><img alt=""></dialog>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function parseCSV(text) {
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"' && text[i + 1] === '"') { f += '"'; i++ } else if (c === '"') q = false; else f += c }
    else if (c === '"') q = true; else if (c === ",") { row.push(f); f = "" }
    else if (c === "\n") { row.push(f); rows.push(row); row = []; f = "" } else if (c !== "\r") f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row) }
  const [head, ...body] = rows;
  return body.map(r => Object.fromEntries(head.map((h, i) => [h, r[i] ?? ""])));
}

function zoom(src) { const d = $("#zoom"); $("img", d).src = src; d.showModal() }
$("#zoom").addEventListener("click", e => e.currentTarget.close());


// ---- Elk cut map: regions are clipped to the body outline; points overshoot the outline on purpose.
const P = pts => "M" + pts.map(p => p.join(" ")).join("L") + "Z";
const ELK_REGIONS = [
  { id: "neck", cuts: ["neck"], color: "#94473a", d: P([[198,88],[345,168],[250,330],[214,236]]), co: { at: [70,300], to: [250,262], text: "Neck" } },
  { id: "mock-tender", cuts: ["mock-tender"], color: "#c0533b", d: P([[345,168],[405,168],[300,335],[250,330]]), co: { at: [300,140], to: [318,250], text: "Mock tender" } },
  { id: "flat-iron", cuts: ["flat-iron"], color: "#a93c2c", d: P([[405,168],[432,168],[436,300],[300,335]]), co: { at: [430,128], to: [405,240], text: "Flat iron" } },
  { id: "clod", cuts: ["clod"], color: "#b9472f", d: P([[300,335],[436,300],[436,340],[422,412],[330,402]]), label: [372,372, "Clod"] },
  { id: "brisket", cuts: ["rib-trim"], name: "Brisket", note: "Thin on elk. It goes in with the rib and flank trim.", color: "#d27d60", d: P([[230,328],[300,335],[330,402],[318,432],[230,432]]), co: { at: [120,420], to: [282,385], text: "Brisket" } },
  { id: "fore-shank", cuts: ["fore-shank"], color: "#86372b", d: P([[318,402],[330,402],[422,412],[404,528],[326,528]]), co: { at: [190,505], to: [358,470], text: "Fore shank" } },
  { id: "backstrap", cuts: ["backstrap-steaks","backstrap-roast","backstrap-trim"], primal: "backstrap", color: "#7a1d18", d: P([[432,168],[705,168],[705,255],[432,255]]), label: [568,226, "Backstrap"] },
  { id: "ribs", cuts: ["rib-trim"], name: "Ribs", color: "#c86c53", d: P([[432,255],[600,253],[600,445],[420,445],[422,412],[436,340],[436,300]]), label: [512,355, "Ribs"] },
  { id: "flank", cuts: ["rib-trim"], name: "Flank", note: "The thin belly wall. It goes in with the rib trim.", color: "#d98d6f", d: P([[600,253],[705,255],[698,330],[692,445],[600,445]]), label: [648,350, "Flank"] },
  { id: "top-sirloin", cuts: ["top-sirloin"], color: "#8e2a21", d: P([[705,168],[800,168],[812,215],[752,268],[705,255]]), co: { at: [775,128], to: [748,215], text: "Top sirloin" } },
  { id: "sirloin-tip", cuts: ["sirloin-tip"], color: "#b44f39", d: P([[705,255],[752,268],[748,345],[735,432],[692,445],[698,330]]), co: { at: [640,585], to: [714,370], text: "Sirloin tip" } },
  { id: "top-round", cuts: ["top-round"], color: "#a13a2c", d: P([[812,215],[860,215],[860,300],[748,345],[752,268]]), co: { at: [880,250], to: [785,285], text: "Top round" } },
  { id: "bottom-round", cuts: ["bottom-round"], color: "#c46045", d: P([[748,345],[860,300],[860,425],[735,432]]), co: { at: [880,395], to: [768,385], text: "Bottom round" } },
  { id: "eye-of-round", cuts: ["eye-of-round"], color: "#6f241c", ellipse: [800,335,15,40], co: { at: [880,322], to: [806,322], text: "Eye of round" } },
  { id: "hind-shank", cuts: ["hind-shank"], color: "#85402f", d: P([[735,432],[860,425],[860,525],[728,525]]), co: { at: [880,470], to: [768,460], text: "Hind shank" } },
];
const ELK_BODY = "M86 196C84 182 92 172 108 166C130 156 155 138 178 118L192 104C215 115 240 140 265 165C290 185 315 195 345 200C450 210 600 205 700 200C760 198 800 210 815 240C825 250 828 268 818 278C820 320 810 370 790 410C790 430 772 455 778 480L770 600L745 602L748 500C745 470 735 445 720 425C700 405 670 400 640 405C560 415 470 418 400 410C385 420 380 440 378 470L372 600L348 602L352 470C350 440 340 420 320 405C295 395 275 370 270 340C265 300 245 260 215 230C190 215 160 210 130 212C112 214 92 212 86 196Z";
const ANTLER = "M204 106C222 60 262 22 318 6C360 -6 404 4 432 30M207 98C190 86 168 80 146 82M214 84C196 70 176 62 156 60M246 52C230 34 218 16 206 -2M290 20C278 0 270 -14 262 -26M344 0C342 -12 340 -20 334 -28";
const TENDERLOIN = "M560 268C590 256 660 254 706 262C700 274 660 282 600 280C580 279 566 275 560 268Z";

function elkMap(cuts, done) {
  const byId = Object.fromEntries(cuts.cuts.map(c => [c.id, c]));
  const shape = r => r.ellipse ? `<ellipse cx="${r.ellipse[0]}" cy="${r.ellipse[1]}" rx="${r.ellipse[2]}" ry="${r.ellipse[3]}" transform="rotate(-10 ${r.ellipse[0]} ${r.ellipse[1]})"` : `<path d="${r.d}"`;
  const isDone = r => r.cuts.every(id => done.has(id));
  const regions = ELK_REGIONS.map(r => `${shape(r)} class="rg" fill="${r.color}" data-r="${r.id}" tabindex="0" role="button" aria-label="${esc(r.name || byId[r.cuts[0]]?.name || r.id)}"/>`).join("");
  const hatches = ELK_REGIONS.filter(isDone).map(r => `${shape(r)} class="done"/>`).join("");
  const labels = ELK_REGIONS.filter(r => r.label).map(r => `<text class="lbl in" x="${r.label[0]}" y="${r.label[1]}" text-anchor="middle">${r.label[2]}</text>`).join("");
  const callouts = [...ELK_REGIONS.filter(r => r.co), { id: "tenderloin", co: { at: [625,128], to: [632,266], text: "Tenderloin" } }].map(r => {
    const [x, y] = r.co.at, [tx, ty] = r.co.to, right = x > tx + 40, anchor = x < tx - 40 ? "end" : right ? "start" : "middle";
    const ly = anchor === "middle" ? (y < ty ? y + 6 : y - 18) : y - 6;
    return `<g class="co" data-r="${r.id}"><line x1="${anchor === "end" ? x + 6 : right ? x - 6 : x}" y1="${ly}" x2="${tx}" y2="${ty}"/><circle cx="${tx}" cy="${ty}" r="3.5"/><text class="lbl" x="${x}" y="${y}" text-anchor="${anchor}">${r.co.text}${(r.cuts || ["tenderloin"]).every(id => done.has(id)) ? " ✓" : ""}</text></g>`;
  }).join("");
  const total = cuts.cuts.length, nDone = cuts.cuts.filter(c => done.has(c.id)).length;
  return `<div class="map"><div>
    <svg viewBox="-10 -40 1010 660" role="img" aria-labelledby="elk-t"><title id="elk-t">Elk cut map. Select a cut for details.</title>
      <defs>
        <clipPath id="bodyclip"><path d="${ELK_BODY}"/></clipPath>
        <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="9" fill="rgba(255,248,238,.18)"/><line x1="0" y1="0" x2="0" y2="9" stroke="rgba(255,248,238,.6)" stroke-width="3"/></pattern>
      </defs>
      <ellipse cx="560" cy="604" rx="330" ry="12" fill="var(--rule)"/>
      <path d="${ANTLER}" transform="translate(22 -8)" fill="none" stroke="#9c8a6a" stroke-width="6" stroke-linecap="round"/>
      <path d="M402 420C398 460 396 520 398 598L420 600C420 540 418 480 425 418Z M700 420C690 470 700 520 716 598L738 598C730 540 728 480 745 430Z" fill="#3b2f26"/>
      <path d="${ELK_BODY}" fill="#4b3b2f"/>
      <g clip-path="url(#bodyclip)">${regions}${hatches}<g id="hlwrap"></g></g>
      <path d="M816 244C826 248 830 262 824 274C818 266 815 256 816 244Z" fill="#3b2f26"/>
      <path d="M345 588L373 588L372 600L348 602ZM745 588L771 588L770 600L745 602Z" fill="#1f1813"/>
      <ellipse cx="205" cy="112" rx="8" ry="22" transform="rotate(-35 205 112)" fill="#5a4636"/>
      <circle cx="158" cy="150" r="4.5" fill="#120d0a"/><ellipse cx="93" cy="193" rx="8" ry="7" fill="#1f1813"/>
      <path d="${ANTLER}" fill="none" stroke="#cdb894" stroke-width="7" stroke-linecap="round"/>
      <path d="${TENDERLOIN}" class="rg" data-r="tenderloin" tabindex="0" role="button" aria-label="Tenderloin" fill="rgba(232,176,75,.55)" stroke="#e8b04b" stroke-width="2.5" stroke-dasharray="7 5"/>
      ${labels}${callouts}
    </svg>
    <div class="key"><label><input type="checkbox" id="showdone" checked> Shade cuts done in 2026</label><span>Dashed = inside the body cavity</span><span>Tap or click any cut</span></div>
  </div>
  <aside class="panel" id="panel" aria-live="polite"><h3>2026 elk</h3><p class="pr">${nDone} of ${total} cuts done</p>
    <div class="progress"><i style="width:${(nDone / total * 100).toFixed(0)}%"></i></div>
    <p>Pick a cut on the elk to see where it is, what to make of it and how it's packed.</p></aside></div>`;
}

function wireMap(cuts, done) {
  const byId = Object.fromEntries(cuts.cuts.map(c => [c.id, c]));
  const primalOf = id => cuts.primals.find(p => p.order.includes(id));
  const regionOf = id => ELK_REGIONS.find(r => r.id === id) || { id, cuts: [id] };
  const svg = $(".map svg"), panel = $("#panel");
  const select = id => {
    const r = regionOf(id), list = r.cuts.map(c => byId[c]).filter(Boolean), c = list[0], pr = primalOf(c.id);
    svg.querySelectorAll(".co").forEach(g => g.classList.toggle("on", g.dataset.r === id));
    const src = svg.querySelector(`.rg[data-r="${id}"]`);
    $("#hlwrap", svg).innerHTML = src && id !== "tenderloin" ? src.outerHTML.replace(/class="rg"/, 'id="hl"').replace(/tabindex="0"/, "") : "";
    const link = x => `<a href="#cut-${x.id}" data-jump="${x.id}">${esc(x.name)}</a>${done.has(x.id) ? " ✓" : ""}`;
    panel.innerHTML = list.length > 1
      ? `<p class="pr">${esc(pr?.name)}</p><h3>${esc(r.name || pr?.name)}</h3><p>${esc(pr?.summary)}</p><ul>${list.map(x => `<li>${link(x)} · <span class="aka">${esc(x.uses.join(", "))}</span></li>`).join("")}</ul>`
      : `<p class="pr">${esc(pr?.name)} · cut ${pr.order.indexOf(c.id) + 1} of ${pr.order.length}</p><h3>${esc(r.name || c.name)}</h3>
        ${r.name ? `<p class="aka">${esc(r.note || "")} Packed as: ${esc(c.name)}.</p>` : c.aka ? `<div class="aka">${c.aka.map(esc).join(" · ")}</div>` : ""}
        <p><b>Find it:</b> ${esc(c.find)}</p>
        <div>${c.uses.map(u => `<span class="tag">${esc(u)}</span>`).join("")}${done.has(c.id) ? `<span class="tag done">done 2026</span>` : ""}</div>
        <p class="aka">${esc(c.pack)}</p><p>${link({ ...c, name: "Show the steps ↓" })}</p>`;
  };
  svg.addEventListener("click", e => { const t = e.target.closest("[data-r]"); if (t) select(t.dataset.r) });
  svg.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.dataset.r) { e.preventDefault(); select(e.target.dataset.r) } });
  panel.addEventListener("click", e => {
    const a = e.target.closest("[data-jump]"); if (!a) return; e.preventDefault();
    const card = document.getElementById("cut-" + a.dataset.jump); if (!card) return;
    card.scrollIntoView({ behavior: "smooth", block: "center" }); card.classList.add("flash"); setTimeout(() => card.classList.remove("flash"), 1600);
  });
  $("#showdone").addEventListener("change", e => svg.querySelectorAll(".done").forEach(h => h.style.display = e.target.checked ? "" : "none"));
}

function render(cuts, hunt, log) {
  const done = new Set(hunt.done_cuts || []);
  const photosFor = id => hunt.photos.filter(p => (p.cuts || []).includes(id));
  $("#guide").innerHTML = elkMap(cuts, done) + cuts.primals.map(p => {
    const list = p.order.map(id => cuts.cuts.find(c => c.id === id)).filter(Boolean);
    return `<h2>${esc(p.name)}</h2><p class="summary">${esc(p.summary)}</p>
      <ul class="marks">${p.landmarks.map(l => `<li>${esc(l)}</li>`).join("")}</ul>
      <div class="cuts">${list.map((c, i) => `<article class="cut" id="cut-${c.id}">
        <h3><span class="n">${i + 1}</span>${esc(c.name)}</h3>
        ${c.aka ? `<div class="aka">${c.aka.map(esc).join(" · ")}</div>` : ""}
        <p><b>Find it:</b> ${esc(c.find)}</p>
        <ol>${c.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol>
        <div>${c.uses.map(u => `<span class="tag">${esc(u)}</span>`).join("")}${done.has(c.id) ? `<span class="tag done">done 2026</span>` : ""}</div>
        <p class="aka">${esc(c.pack)}</p>
        ${photosFor(c.id).length ? `<div class="thumbs">${photosFor(c.id).map(ph => `<img loading="lazy" src="${esc(ph.file)}" alt="${esc(ph.caption)}" title="${esc(ph.caption)}">`).join("")}</div>` : ""}
      </article>`).join("")}</div>`;
  }).join("");

  const lb = log.reduce((s, r) => s + (parseFloat(r.total_lb) || 0), 0);
  const pk = log.reduce((s, r) => s + (parseInt(r.packages) || 0), 0);
  const cols = ["date", "source", "cut", "packages", "package_size", "total_lb", "notes"];
  $("#hunt").innerHTML = `<h2>${esc(hunt.title)}</h2>
    <p class="summary">Harvested ${esc(new Date(hunt.harvested).toLocaleString([], { weekday: "long", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }))} · ${esc(hunt.tag)}</p>
    <div class="stats"><div><b>${lb.toFixed(1)}</b>lb logged</div><div><b>${pk}</b>packages counted</div><div><b>${hunt.remaining.length}</b>quarters left</div></div>
    <h2>Freezer log</h2><div class="table-wrap"><table><thead><tr>${cols.map(c => `<th>${c.replace("_", " ")}</th>`).join("")}</tr></thead>
    <tbody>${log.map(r => `<tr>${cols.map(c => `<td class="${["packages", "total_lb"].includes(c) ? "num" : ""}">${esc(r[c])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
    <h2>Still to do</h2><ul class="marks">${hunt.remaining.map(r => `<li>${esc(r)}</li>`).join("")}</ul>
    <h2>Lessons</h2><ul class="marks">${hunt.lessons.map(r => `<li>${esc(r)}</li>`).join("")}</ul>
    <h2>Handling</h2><ul class="marks">${hunt.handling.map(r => `<li>${esc(r)}</li>`).join("")}</ul>
    <h2>Photos</h2><div class="gallery">${hunt.photos.map(p => `<figure><img loading="lazy" src="${esc(p.file)}" alt="${esc(p.caption)}"><figcaption>${esc(p.caption)}</figcaption></figure>`).join("")}</div>`;
  wireMap(cuts, done);
  document.querySelectorAll("main img").forEach(img => img.addEventListener("click", () => zoom(img.src)));
}

document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("nav button").forEach(x => x.setAttribute("aria-pressed", x === b));
  document.querySelectorAll("main section").forEach(s => s.hidden = s.id !== b.dataset.view);
}));

Promise.all([
  fetch("data/cuts.json").then(r => r.json()),
  fetch("data/hunts/2026-elk/hunt.json").then(r => r.json()),
  fetch("data/hunts/2026-elk/freezer-log.csv").then(r => r.text()).then(parseCSV),
]).then(([c, h, l]) => render(c, h, l))
  .catch(e => { $("#guide").textContent = "Could not load data: " + e.message });
</script>
