<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elk Butchering 101</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root { --bg:#efe6d6; --card:#f8f2e7; --ink:#2a2420; --muted:#6f6357; --rule:#d6c8b2; --accent:#9b2a1f; --accent-soft:#f1d9d3; --ok:#4f6b3a; color-scheme: light }
@media (prefers-color-scheme: dark) { :root { --bg:#1c1916; --card:#26221e; --ink:#ece3d6; --muted:#a8998a; --rule:#3d362f; --accent:#e0705f; --accent-soft:#3a2420; --ok:#9cbc80; color-scheme: dark } }
* { box-sizing: border-box }
body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.55 "Source Serif 4", Georgia, serif }
header, main { max-width: 960px; margin: 0 auto; padding-left:max(16px, env(safe-area-inset-left)); padding-right:max(16px, env(safe-area-inset-right)) }
header { padding-block: 28px 8px; border-bottom: 3px double var(--rule) }
h1, h2, h3, nav button, .tag { font-family: Oswald, "Arial Narrow", sans-serif; letter-spacing: .02em }
h1 { margin:0; font-size: 2.2rem; text-transform: uppercase } h1 span { color: var(--accent) }
.sub { margin: 2px 0 14px; color: var(--muted) }
nav { display:flex; gap:8px; flex-wrap:wrap }
nav button { border:1px solid var(--rule); background:var(--card); color:var(--ink); padding:8px 14px; font-size:1rem; text-transform:uppercase; cursor:pointer; border-radius:2px }
nav button[aria-pressed=true] { background:var(--accent); border-color:var(--accent); color:var(--card) }
main { padding-block: 20px 60px }
h2 { font-size:1.5rem; text-transform:uppercase; margin: 28px 0 4px; border-bottom: 2px solid var(--ink); padding-bottom: 2px }
.summary { color: var(--muted); margin: 6px 0 10px; max-width: 65ch }
ul.marks { margin: 0 0 14px; padding-left: 20px } ul.marks li { margin: 2px 0 }
.cuts { display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap:14px }
.cut { background:var(--card); border:1px solid var(--rule); border-left: 5px solid var(--accent); padding: 12px 14px; min-width:0 }
.cut h3 { margin:0; font-size:1.25rem; text-transform: uppercase; display:flex; gap:8px; align-items:baseline }
.cut .n { color: var(--accent) }
.aka { color: var(--muted); font-style: italic; font-size: .9rem }
.cut ol { padding-left: 20px; margin: 8px 0 } .cut p { margin: 6px 0 }
.tag { display:inline-block; font-size:.8rem; text-transform:uppercase; background:var(--accent-soft); color:var(--accent); padding:1px 7px; margin: 2px 4px 0 0; border-radius:2px }
.tag.done { background: transparent; border:1px solid var(--ok); color: var(--ok) }
.thumbs { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px } .thumbs img { width: 84px; height: 112px; object-fit: cover; border:1px solid var(--rule); cursor: zoom-in }
.table-wrap { overflow-x:auto; border:1px solid var(--rule); background: var(--card) }
table { border-collapse: collapse; width:100%; font-size:.95rem } th, td { padding: 6px 10px; border-bottom: 1px solid var(--rule); text-align:left; white-space: nowrap }
th { font-family: Oswald, sans-serif; text-transform: uppercase; font-weight:500; color: var(--muted) } td.num { text-align:right; font-variant-numeric: tabular-nums }
.stats { display:flex; gap:24px; flex-wrap:wrap; margin: 10px 0 16px } .stats b { display:block; font: 600 2rem Oswald, sans-serif; color: var(--accent) }
.gallery { display:grid; grid-template-columns: repeat(auto-fill, minmax(180px,1fr)); gap:12px } .gallery figure { margin:0 } .gallery img { width:100%; aspect-ratio: 3/4; object-fit: cover; border:1px solid var(--rule); cursor: zoom-in }
figcaption { font-size:.85rem; color: var(--muted) }
dialog { border:none; padding:0; background:transparent; max-width: 96vw } dialog img { max-height: 92vh; max-width: 96vw; display:block } dialog::backdrop { background: rgba(0,0,0,.8) }

/* elk map */
.map { display:grid; grid-template-columns: minmax(0,1fr) 250px; gap:16px; margin: 18px 0 8px; background:var(--card); border:1px solid var(--rule); padding:14px }
@media (max-width: 760px) { .map { grid-template-columns: 1fr } }
.map svg { width:100%; height:auto; display:block; touch-action: manipulation }
.map .rg { cursor:pointer; stroke: rgba(255,248,238,.9); stroke-width: 2.5; stroke-dasharray: 8 5; fill-opacity: .4; mix-blend-mode: multiply; transition: fill-opacity .15s }
.map .rg.tl { mix-blend-mode: normal; fill-opacity: 1 }
.map .cutlayer.off .rg:not(:hover):not(:focus) { fill-opacity: 0; stroke-opacity: .0 }
.map .rg:hover, .map .rg:focus { fill-opacity: .85; outline: none }
.map .done { fill: url(#hatch); pointer-events: none }
.map .lbl { font: 600 27px Oswald, sans-serif; letter-spacing: .05em; text-transform: uppercase; pointer-events: none }
.map .in { fill:#fff8ee; paint-order: stroke; stroke: rgba(40,15,10,.7); stroke-width: 5px }
.map .co { cursor:pointer } .map .co text { fill: var(--ink) } .map .co line { stroke: var(--ink); stroke-width: 2; opacity: .7 } .map .co circle { fill: var(--ink) }
.map .co:hover text, .map .co.on text { fill: var(--accent) }
.map #hl { fill:none; stroke: #fff; stroke-width: 6; mix-blend-mode: normal; pointer-events:none; stroke-linejoin: round }
.map .key { font-size:.85rem; color:var(--muted); margin-top:6px; display:flex; gap:14px; flex-wrap:wrap; align-items:center }
.map .key label { cursor:pointer }
.panel h3 { margin:0; font-size:1.4rem; text-transform:uppercase } .panel .pr { color:var(--muted); font: 500 .85rem Oswald, sans-serif; text-transform:uppercase; letter-spacing:.05em }
.panel p { margin: 6px 0 } .panel ul { padding-left: 18px; margin: 6px 0 }
.panel a { color: var(--accent) }
.progress { height:8px; background: var(--rule); border-radius: 4px; overflow:hidden; margin: 6px 0 2px } .progress i { display:block; height:100%; background: var(--ok) }
.cut.flash { outline: 3px solid var(--accent); outline-offset: 2px; transition: outline-color 1.5s }

/* break down */
.quarters { display:grid; grid-template-columns: repeat(auto-fill, minmax(170px,1fr)); gap:10px; margin: 14px 0 }
.quarters button { text-align:left; background:var(--card); border:1px solid var(--rule); border-left:5px solid var(--rule); padding:10px 12px; cursor:pointer; color:var(--ink); font: 500 1.05rem Oswald, sans-serif; text-transform:uppercase }
.quarters button small { display:block; font: .85rem "Source Serif 4", serif; text-transform:none; color:var(--muted) }
.quarters button[aria-pressed=true] { border-left-color: var(--accent); background: var(--accent-soft) }
.bd { display:grid; grid-template-columns: minmax(0,1.25fr) minmax(0,1fr); gap:18px; align-items:start }
@media (max-width: 760px) { .bd { grid-template-columns: 1fr } }
.bd ol.order { padding-left: 0; list-style:none; margin: 8px 0 } .bd ol.order > li { border:1px solid var(--rule); background:var(--card); margin-bottom:6px }
.bd ol.order summary { padding: 8px 10px; cursor:pointer; font: 500 1.05rem Oswald, sans-serif; text-transform:uppercase; display:flex; gap:8px; align-items:center }
.bd ol.order .body { padding: 0 12px 10px } .bd ol.order > li.next { border-color: var(--accent); box-shadow: inset 4px 0 0 var(--accent) }
.st { font-size:.75rem; padding:1px 6px; border-radius:2px; margin-left:auto } .st.ok { color:var(--ok); border:1px solid var(--ok) } .st.nx { background:var(--accent); color:var(--card) }
.chat { background:var(--card); border:1px solid var(--rule); padding: 12px; display:flex; flex-direction:column; gap:12px }
.msg { max-width: 100% } .msg.you { align-self:flex-end; background: var(--accent-soft); padding: 8px 10px; border-radius: 6px; max-width: 85% }
.msg.you img { max-width: 160px; display:block; border-radius:4px; margin-bottom:4px; cursor: zoom-in }
.msg.ai img { width:100%; max-height: 70vh; object-fit: contain; background:#000; border-radius:4px; cursor: zoom-in }
.msg.ai ol { padding-left: 22px; margin: 6px 0 } .msg.ai ol li { margin: 4px 0 }
.msg .who { font: 500 .8rem Oswald, sans-serif; text-transform: uppercase; color: var(--muted); letter-spacing:.05em }
.warn { border-left: 4px solid #c98a1b; background: rgba(201,138,27,.12); padding: 6px 10px; margin: 6px 0 }
.wait { color: var(--muted); font-style: italic } .wait::after { content: " ●"; animation: blink 1s infinite } @keyframes blink { 50% { opacity: .2 } }
.composer { display:grid; gap:8px; border-top: 1px solid var(--rule); padding-top: 10px }
.composer textarea, .composer input[type=text] { width:100%; font: inherit; padding: 8px; border:1px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 2px }
.composer .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center }
.btn { font: 500 1rem Oswald, sans-serif; text-transform:uppercase; border:1px solid var(--accent); background: var(--accent); color: var(--card); padding: 9px 16px; cursor:pointer; border-radius:2px }
.btn.ghost { background: transparent; color: var(--accent) } .btn:disabled { opacity:.5; cursor: wait }
label.file { display:inline-flex } label.file input { display:none }
.preview { max-height: 120px; border-radius: 4px; border:1px solid var(--rule) }
.empty { color: var(--muted) }
.st.pg { color:#b5761a; border:1px solid #b5761a } .bd ol.order > li.prog { box-shadow: inset 4px 0 0 #c98a1b }
.btn.sm { font-size:.85rem; padding: 5px 10px } .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap }
h3.day { font: 500 1.05rem Oswald, sans-serif; text-transform:uppercase; margin: 12px 0 2px; color: var(--muted) }

/* quarter photo viewer */
.viewer { background: var(--card); border:1px solid var(--rule); padding: 10px; margin: 8px 0 14px }
.viewer.novw p { margin:0; color: var(--muted) }
.vtabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom: 8px }
.vtabs button { font: 500 .9rem Oswald, sans-serif; text-transform:uppercase; border:1px solid var(--rule); background:transparent; color:var(--ink); padding: 4px 10px; cursor:pointer; border-radius:2px }
.vtabs button[aria-pressed=true] { background: var(--ink); color: var(--card); border-color: var(--ink) }
svg.photo { display:block; width:100%; max-height: 72vh; touch-action: manipulation; background: radial-gradient(ellipse at center, rgba(0,0,0,.06), transparent 70%) }
.vr { cursor:pointer; stroke-width: var(--sw); stroke-linejoin: round; transition: fill-opacity .15s }
.vr:focus { outline:none }
.vr.cut { fill:#e07b54; fill-opacity:.18; stroke:#fff8ee; stroke-opacity:.7; stroke-dasharray: calc(var(--sw)*3) calc(var(--sw)*2) }
.vr.cut.next { fill:#d0402a; fill-opacity:.45; stroke:#fff; stroke-opacity:1 }
.vr.cut.prog { fill:#e3a32b; fill-opacity:.45; stroke:#fff3d6; stroke-opacity:1 }
.vr.cut.done { fill:url(#vhatch); fill-opacity:1; stroke:#fff8ee; stroke-opacity:.6 }
.vr.mark { fill:#35b6e0; fill-opacity:.3; stroke:#bfefff; stroke-dasharray: calc(var(--sw)*2) calc(var(--sw)*2) }
.vr:hover, .vr:focus-visible { fill-opacity:.65 } .vr.done:hover { fill:#888; fill-opacity:.5 }
.vr.sel { fill-opacity:.7; stroke:#fff; stroke-opacity:1; stroke-width: calc(var(--sw)*2); stroke-dasharray: none }
.vl { cursor:pointer } .vl .hit { stroke: transparent; stroke-width: calc(var(--sw)*8); fill:none }
.vl .ln { stroke:#e8281c; stroke-width: calc(var(--sw)*1.6); stroke-dasharray: calc(var(--sw)*4) calc(var(--sw)*3); fill:none; stroke-linecap: round }
.vl.sel .ln, .vl:hover .ln { stroke:#fff; stroke-dasharray:none }
.vt { font-family: Oswald, sans-serif; font-weight:600; fill:#fff8ee; paint-order: stroke; stroke: rgba(30,10,6,.8); stroke-width: .18em; pointer-events:none; text-transform: uppercase }
.vt.done { fill:#d9d0c4 } .vt.mk { fill:#d6f5ff }
.vkey { display:flex; flex-wrap:wrap; gap: 4px 12px; font-size:.8rem; color: var(--muted); margin-top: 6px }
.vkey i.k { display:inline-block; width:12px; height:12px; margin-right:4px; vertical-align:-1px; border:1px solid var(--rule) }
.k.next { background:#d0402a } .k.prog { background:#e3a32b } .k.done { background: repeating-linear-gradient(45deg,#bbb 0 3px,#eee 3px 6px) } .k.later { background: rgba(224,123,84,.3) } .k.mark { background: rgba(53,182,224,.5) } .k.line { background: linear-gradient(#e8281c,#e8281c) center/100% 3px no-repeat }
.vcard { border-top: 1px solid var(--rule); padding-top: 8px; margin-top: 8px } .vcard h3 { margin:0; font: 600 1.15rem Oswald, sans-serif; text-transform:uppercase; display:flex; gap:8px; align-items:center } .vcard p { margin: 6px 0 } .vcard a { color: var(--accent) }
.spin { cursor: grab; touch-action: pan-y; user-select:none } .spin:active { cursor: grabbing } .spin img { width:100%; max-height:72vh; object-fit: contain; display:block }
.spinr { width:100% }
</style>
</head>
<body>
<header>
  <h1>Elk Butchering <span>101</span></h1>
  <p class="sub">Cut guide and freezer log, Kohl family. Hang it, find the landmark, make one cut at a time.</p>
  <nav><button data-view="guide" aria-pressed="true">Cut guide</button><button data-view="breakdown" aria-pressed="false">Break down</button><button data-view="hunt" aria-pressed="false">2026 elk</button></nav>
</header>
<main>
  <section id="guide"></section>
  <section id="breakdown" hidden></section>
  <section id="hunt" hidden></section>
</main>
<dialog id="zoom"><img alt=""></dialog>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function parseCSV(text) {
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"' && text[i + 1] === '"') { f += '"'; i++ } else if (c === '"') q = false; else f += c }
    else if (c === '"') q = true; else if (c === ",") { row.push(f); f = "" }
    else if (c === "\n") { row.push(f); rows.push(row); row = []; f = "" } else if (c !== "\r") f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row) }
  const [head, ...body] = rows;
  return body.map(r => Object.fromEntries(head.map((h, i) => [h, r[i] ?? ""])));
}

function zoom(src) { const d = $("#zoom"); $("img", d).src = src; d.showModal() }
$("#zoom").addEventListener("click", e => e.currentTarget.close());


// ---- Elk cut map: a real elk photo (img/elk.webp, cut out with its mask img/elk-mask.png).
// Region points are photo pixels and overshoot the body on purpose; the mask trims them to the animal.
const P = pts => "M" + pts.map(p => p.join(" ")).join("L") + "Z";
const ELK_REGIONS = [
  { id: "neck", cuts: ["neck"], color: "#8c3b2e", d: P([[425,220],[600,218],[510,450],[470,575],[320,575],[320,440],[385,330]]), co: { at: [318,450], to: [452,390], text: "Neck" } },
  { id: "mock-tender", cuts: ["mock-tender"], color: "#c0533b", d: P([[600,218],[665,218],[565,455],[510,450]]), co: { at: [318,515], to: [568,340], text: "Mock tender" } },
  { id: "flat-iron", cuts: ["flat-iron"], color: "#a93c2c", d: P([[665,218],[724,220],[696,432],[565,455]]), co: { at: [850,100], to: [668,330], text: "Flat iron" } },
  { id: "clod", cuts: ["clod"], color: "#d0583a", d: P([[565,455],[696,432],[692,520],[650,545],[578,538]]), co: { at: [318,660], to: [628,488], text: "Clod" } },
  { id: "brisket", cuts: ["brisket-rib-flaps"], color: "#d27d60", d: P([[510,450],[565,455],[578,538],[560,600],[470,600],[470,575]]), co: { at: [318,590], to: [528,530], text: "Brisket" } },
  { id: "fore-shank", cuts: ["fore-shank"], color: "#86372b", d: P([[560,600],[578,538],[650,545],[692,520],[790,540],[790,670],[560,670]]), co: { at: [470,735], to: [622,615], text: "Fore shank" } },
  { id: "backstrap", cuts: ["backstrap-steaks","backstrap-roast","backstrap-trim"], primal: "backstrap", color: "#7a1d18", d: P([[724,200],[988,215],[988,306],[712,306]]), label: [850,280, "Backstrap"] },
  { id: "ribs", cuts: ["rib-trim"], name: "Ribs", color: "#c86c53", d: P([[712,306],[880,306],[880,580],[692,580],[692,520],[696,432]]), label: [790,440, "Ribs"] },
  { id: "flank", cuts: ["rib-trim"], name: "Flank", note: "The thin belly wall. It goes in with the rib trim.", color: "#d98d6f", d: P([[880,306],[988,306],[978,420],[962,580],[880,580]]), label: [930,445, "Flank"] },
  { id: "top-sirloin", cuts: ["top-sirloin"], color: "#8e2a21", d: P([[988,215],[1100,235],[1085,322],[1022,342],[988,306]]), co: { at: [1150,100], to: [1040,285], text: "Top sirloin" } },
  { id: "sirloin-tip", cuts: ["sirloin-tip"], color: "#b44f39", d: P([[988,306],[1022,342],[1032,442],[1002,532],[962,580],[978,420]]), co: { at: [965,750], to: [1000,450], text: "Sirloin tip" } },
  { id: "top-round", cuts: ["top-round"], color: "#a13a2c", d: P([[1100,235],[1200,290],[1200,402],[1062,422],[1032,442],[1022,342],[1085,322]]), co: { at: [1205,330], to: [1120,345], text: "Top round" } },
  { id: "bottom-round", cuts: ["bottom-round"], color: "#c46045", d: P([[1032,442],[1062,422],[1200,402],[1200,525],[1100,565],[1002,532]]), co: { at: [1205,520], to: [1080,495], text: "Bottom round" } },
  { id: "eye-of-round", cuts: ["eye-of-round"], color: "#6f241c", ellipse: [1128,452,20,52], co: { at: [1205,425], to: [1132,440], text: "Eye of round" } },
  { id: "hind-shank", cuts: ["hind-shank"], color: "#85402f", d: P([[1002,532],[1100,565],[1200,525],[1200,690],[1040,690],[1040,600]]), co: { at: [1205,640], to: [1110,625], text: "Hind shank" } },
];
const TENDERLOIN = "M850 322C890 304 960 300 1005 308C1000 322 960 332 900 332C875 332 858 328 850 322Z";

function elkMap(cuts, done) {
  const byId = Object.fromEntries(cuts.cuts.map(c => [c.id, c]));
  const shape = r => r.ellipse ? `<ellipse cx="${r.ellipse[0]}" cy="${r.ellipse[1]}" rx="${r.ellipse[2]}" ry="${r.ellipse[3]}" transform="rotate(-8 ${r.ellipse[0]} ${r.ellipse[1]})"` : `<path d="${r.d}"`;
  const isDone = r => r.cuts.every(id => done.has(id));
  const regions = ELK_REGIONS.map(r => `${shape(r)} class="rg" fill="${r.color}" data-r="${r.id}" tabindex="0" role="button" aria-label="${esc(r.name || byId[r.cuts[0]]?.name || r.id)}"/>`).join("");
  const hatches = ELK_REGIONS.filter(isDone).map(r => `${shape(r)} class="done"/>`).join("");
  const labels = ELK_REGIONS.filter(r => r.label).map(r => `<text class="lbl in" x="${r.label[0]}" y="${r.label[1]}" text-anchor="middle">${r.label[2]}</text>`).join("");
  const callouts = [...ELK_REGIONS.filter(r => r.co), { id: "tenderloin", co: { at: [1010,170], to: [925,318], text: "Tenderloin" } }].map(r => {
    const [x, y] = r.co.at, [tx, ty] = r.co.to, right = x > tx + 40, anchor = x < tx - 40 ? "end" : right ? "start" : "middle";
    const ly = anchor === "middle" ? (y < ty ? y + 8 : y - 26) : y - 9;
    return `<g class="co" data-r="${r.id}"><line x1="${anchor === "end" ? x + 8 : right ? x - 8 : x}" y1="${ly}" x2="${tx}" y2="${ty}"/><circle cx="${tx}" cy="${ty}" r="5"/><text class="lbl" x="${x}" y="${y}" text-anchor="${anchor}">${r.co.text}${(r.cuts || ["tenderloin"]).every(id => done.has(id)) ? " ✓" : ""}</text></g>`;
  }).join("");
  const total = cuts.cuts.length, nDone = cuts.cuts.filter(c => done.has(c.id)).length;
  return `<div class="map"><div>
    <svg viewBox="60 40 1340 730" role="img" aria-labelledby="elk-t"><title id="elk-t">Elk cut map. Select a cut for details.</title>
      <defs>
        <mask id="elkmask" maskUnits="userSpaceOnUse" x="0" y="0" width="1344" height="768"><image href="img/elk-mask.png" width="1344" height="768"/></mask>
        <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="12" stroke="rgba(255,248,238,.5)" stroke-width="3"/></pattern>
        <radialGradient id="shadow"><stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
      </defs>
      <ellipse cx="880" cy="760" rx="360" ry="22" fill="url(#shadow)"/>
      <image href="img/elk.webp" width="1344" height="768"/>
      <g mask="url(#elkmask)" class="cutlayer">${regions}${hatches}<g id="hlwrap"></g></g>
      <path d="${TENDERLOIN}" class="rg tl" data-r="tenderloin" tabindex="0" role="button" aria-label="Tenderloin" fill="rgba(232,176,75,.75)" stroke="#f3c463" stroke-width="3" stroke-dasharray="9 6"/>
      ${labels}${callouts}
    </svg>
    <div class="key"><label><input type="checkbox" id="showdone" checked> Shade cuts done in 2026</label><label><input type="checkbox" id="showcuts" checked> Show cuts</label><span>Dashed = inside the body cavity</span></div>
  </div>
  <aside class="panel" id="panel" aria-live="polite"><h3>2026 elk</h3><p class="pr">${nDone} of ${total} cuts done</p>
    <div class="progress"><i style="width:${(nDone / total * 100).toFixed(0)}%"></i></div>
    <p>Tap a cut on the elk to see where it is, what to make of it and how it's packed, or to break that quarter down with photos.</p>
    <div class="quarters" style="grid-template-columns:1fr">${cuts.primals.map(p => `<button data-q="${p.id}">${esc(p.name)}<small>${p.order.filter(id => done.has(id)).length} of ${p.order.length} done · break it down →</small></button>`).join("")}</div></aside></div>`;
}

function wireMap(cuts, done) {
  const byId = Object.fromEntries(cuts.cuts.map(c => [c.id, c]));
  const primalOf = id => cuts.primals.find(p => p.order.includes(id));
  const regionOf = id => ELK_REGIONS.find(r => r.id === id) || { id, cuts: [id] };
  const svg = $(".map svg"), panel = $("#panel");
  const select = id => {
    const r = regionOf(id), list = r.cuts.map(c => byId[c]).filter(Boolean), c = list[0], pr = primalOf(c.id);
    svg.querySelectorAll(".co").forEach(g => g.classList.toggle("on", g.dataset.r === id));
    const src = svg.querySelector(`.rg[data-r="${id}"]`);
    $("#hlwrap", svg).innerHTML = src && id !== "tenderloin" ? src.outerHTML.replace(/class="rg"/, 'id="hl"').replace(/tabindex="0"/, "") : "";
    const link = x => `<a href="#cut-${x.id}" data-jump="${x.id}">${esc(x.name)}</a>${done.has(x.id) ? " ✓" : ""}`;
    panel.innerHTML = list.length > 1
      ? `<p class="pr">${esc(pr?.name)}</p><h3>${esc(r.name || pr?.name)}</h3><p>${esc(pr?.summary)}</p><ul>${list.map(x => `<li>${link(x)} · <span class="aka">${esc(x.uses.join(", "))}</span></li>`).join("")}</ul>`
      : `<p class="pr">${esc(pr?.name)} · cut ${pr.order.indexOf(c.id) + 1} of ${pr.order.length}</p><h3>${esc(r.name || c.name)}</h3>
        ${r.name ? `<p class="aka">${esc(r.note || "")} Packed as: ${esc(c.name)}.</p>` : c.aka ? `<div class="aka">${c.aka.map(esc).join(" · ")}</div>` : ""}
        <p><b>Find it:</b> ${esc(c.find)}</p>
        <div>${c.uses.map(u => `<span class="tag">${esc(u)}</span>`).join("")}${done.has(c.id) ? `<span class="tag done">done 2026</span>` : ""}</div>
        <p class="aka">${esc(c.pack)}</p><p>${link({ ...c, name: "Show the steps ↓" })}</p>`;
    panel.insertAdjacentHTML("beforeend", `<p><button class="btn" data-q="${pr.id}">Break down the ${esc(pr.name.toLowerCase())} →</button></p>`);
  };
  svg.addEventListener("click", e => { const t = e.target.closest("[data-r]"); if (t) select(t.dataset.r) });
  svg.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.dataset.r) { e.preventDefault(); select(e.target.dataset.r) } });
  panel.addEventListener("click", e => {
    const q = e.target.closest("[data-q]"); if (q) return openBreakdown(q.dataset.q);
    const a = e.target.closest("[data-jump]"); if (!a) return; e.preventDefault();
    const card = document.getElementById("cut-" + a.dataset.jump); if (!card) return;
    card.scrollIntoView({ behavior: "smooth", block: "center" }); card.classList.add("flash"); setTimeout(() => card.classList.remove("flash"), 1600);
  });
  $("#showdone").addEventListener("change", e => svg.querySelectorAll(".done").forEach(h => h.style.display = e.target.checked ? "" : "none"));
  $("#showcuts").addEventListener("change", e => $(".cutlayer", svg).classList.toggle("off", !e.target.checked));
}


// ---- Break down: pick the piece on the hook (shoulder #1, hindquarter #2...), see it with its cuts
// outlined on a cut-out photo, tap a cut for how to find and take it, mark it done, and send
// photos to Claude for the next cut drawn on them.
let CUTS, DONE, HUNT, BD = null, VIEW = 0, SEL = null;
const primalById = id => CUTS.primals.find(p => p.id === id);
const cutById = id => CUTS.cuts.find(c => c.id === id);
// Pieces come from hunt.json; a primal with none (backstrap, tenderloin) is one implicit piece.
function pieces() {
  return CUTS.primals.flatMap(p => {
    const own = (HUNT.pieces || []).filter(x => x.primal === p.id);
    return own.length ? own : [{ id: p.id, primal: p.id, name: p.name, done: p.order.filter(id => DONE.has(id)), views: [], implicit: true }];
  });
}
const pieceById = id => pieces().find(x => x.id === id);
// Next cut: the first one not done after the last one done, so cuts skipped on purpose stay behind you.
function nextCut(piece) {
  const order = primalById(piece.primal).order, d = new Set(piece.done);
  const last = Math.max(-1, ...order.map((id, i) => d.has(id) ? i : -1));
  return order.slice(last + 1).find(id => !d.has(id)) || order.find(id => !d.has(id));
}
const stateOf = (piece, id) => piece.done.includes(id) ? "done" : (piece.in_progress || []).includes(id) ? "prog" : id === nextCut(piece) ? "next" : "later";
const STATE_TAG = { done: `<span class="st ok">done</span>`, prog: `<span class="st pg">in progress</span>`, next: `<span class="st nx">next</span>`, later: "" };
const thread = id => JSON.parse(localStorage.getItem("elk-thread-" + id) || "null") || { thread: null, side: "", msgs: [] };
const saveThread = (id, t) => localStorage.setItem("elk-thread-" + id, JSON.stringify(t));

function show(view) {
  document.querySelectorAll("nav button").forEach(x => x.setAttribute("aria-pressed", x.dataset.view === view));
  document.querySelectorAll("main section").forEach(s => s.hidden = s.id !== view);
}

// From the map a primal id comes in: open its first piece that still has cuts left.
function openBreakdown(id) {
  const piece = pieceById(id) || pieces().find(x => x.primal === id && nextCut(x)) || pieces().find(x => x.primal === id);
  BD = piece?.id || null; VIEW = 0; SEL = null; renderBreakdown(); show("breakdown"); window.scrollTo({ top: 0 });
}

function renderBreakdown() {
  const all = pieces();
  const quarters = all.map(x => {
    const n = primalById(x.primal).order.length;
    return `<button data-q="${x.id}" aria-pressed="${x.id === BD}">${esc(x.name)}<small>${x.done.length} of ${n} cuts done${(x.views || []).length ? " · 📷" : ""}</small></button>`;
  }).join("");
  if (!BD) { $("#breakdown").innerHTML = `<h2>Break down a quarter</h2><p class="summary">Pick the piece on the hook. You'll see it with its cuts outlined, the cut order, and you can send a photo for the next cut drawn on it.</p><div class="quarters">${quarters}</div>`; return }
  const piece = pieceById(BD), p = primalById(piece.primal), t = thread(piece.id);
  $("#breakdown").innerHTML = `<h2>Break down a quarter</h2><div class="quarters">${quarters}</div>
  <div class="bd"><div>
    <h2 style="margin-top:0">${esc(piece.name)}</h2>
    <div id="viewer"></div>
    <p class="summary">${esc(p.summary)}</p>
    <ul class="marks">${p.landmarks.map(l => `<li>${esc(l)}</li>`).join("")}</ul>
    <ol class="order">${p.order.map((id, i) => { const c = cutById(id); if (!c) return ""; const st = stateOf(piece, id);
      return `<li class="${st}" id="step-${id}"><details ${st === "next" || st === "prog" ? "open" : ""}><summary data-sel="${id}"><span class="n" style="color:var(--accent)">${i + 1}</span>${esc(c.name)}${STATE_TAG[st]}</summary>
        <div class="body"><p><b>Find it:</b> ${esc(c.find)}</p><ol>${c.steps.map(x => `<li>${esc(x)}</li>`).join("")}</ol><p class="aka">${esc(c.pack)}</p>${doneButton(piece, id)}</div></details></li>` }).join("")}</ol>
  </div>
  <div class="chat" id="chat">
    <div class="who">Ask Claude about ${esc(piece.name.toLowerCase())}</div>
    <div id="msgs">${t.msgs.length ? t.msgs.map(renderMsg).join("") : `<p class="empty">Take a photo of the piece on the hook, with the whole face in frame and good light. Claude will find the landmarks, tell you the next cut and draw it on your photo.</p>`}</div>
    <form class="composer" id="composer">
      <input type="text" name="side" placeholder="Anything to add? e.g. left side, already skinned" value="${esc(t.side)}">
      <textarea name="message" rows="2" placeholder="Optional: what you see or want to know (e.g. 'flat iron is off, what next?')"></textarea>
      <div class="row">
        <label class="file btn ghost">📷 Photo<input type="file" name="photo" accept="image/*" capture="environment"></label>
        <img class="preview" id="preview" hidden alt="">
        <button class="btn" type="submit">Send</button>
        ${t.msgs.length ? `<button class="btn ghost" type="button" id="newthread">New thread</button>` : ""}
      </div>
    </form>
  </div></div>`;
  renderViewer();
}

const doneButton = (piece, id) => piece.done.includes(id)
  ? `<button class="btn ghost sm" data-done="${id}" data-on="0">Undo: not done</button>`
  : `<button class="btn sm" data-done="${id}" data-on="1">Mark done on ${esc(piece.name.toLowerCase())}</button>`;

// The photo viewer: the cut-out quarter, each cut outlined and shaded by state. Regions are in the
// photo's own pixels (see tools/cutout.py); the mask trims them to the meat's edge.
function renderViewer() {
  const box = $("#viewer"); if (!box) return;
  const piece = pieceById(BD), views = piece.views || [], spin = piece.spin?.frames?.length;
  if (!views.length && !spin) {
    box.innerHTML = `<div class="viewer novw"><p><b>No photos of this one yet.</b> When it's on the hook, send a photo of the outside and one of the inside (or a 360 set) and the cuts get outlined on it here.</p></div>`;
    return;
  }
  if (VIEW !== "spin" && !views[VIEW]) VIEW = 0;
  const tabs = views.map((v, i) => `<button data-vw="${i}" aria-pressed="${i === VIEW}">${esc(v.label)}</button>`).join("") + (spin ? `<button data-vw="spin" aria-pressed="${VIEW === "spin"}">360°</button>` : "");
  if (VIEW === "spin" || !views.length) { box.innerHTML = `<div class="viewer"><div class="vtabs">${tabs}</div>${spinner(piece.spin)}</div>`; wireSpin(); return }
  const v = views[VIEW], [x, y, w, h] = v.box, fs = Math.round(Math.max(w, h * .6) / 17);
  const order = primalById(piece.primal).order;
  const pts = r => r.pts.map(q => q.join(",")).join(" ");
  const mid = r => {  // area centroid, so labels sit inside the shape
    let a = 0, cx = 0, cy = 0;
    r.pts.forEach(([x1, y1], i) => { const [x2, y2] = r.pts[(i + 1) % r.pts.length], k = x1 * y2 - x2 * y1; a += k; cx += (x1 + x2) * k; cy += (y1 + y2) * k });
    return [cx / (3 * a), cy / (3 * a)];
  };
  const on = r => SEL && (r.cut ? SEL === r.cut : SEL === "m" + v.regions.indexOf(r));
  const shapes = v.regions.map((r, i) => {
    if (r.type === "cut") return `<polygon points="${pts(r)}" class="vr cut ${stateOf(piece, r.cut)}${on(r) ? " sel" : ""}" data-sel="${r.cut}" tabindex="0" role="button" aria-label="${esc(cutById(r.cut)?.name)}"/>`;
    if (r.type === "landmark") return `<polygon points="${pts(r)}" class="vr mark${on(r) ? " sel" : ""}" data-sel="m${i}" tabindex="0" role="button" aria-label="${esc(r.name)}"/>`;
    return "";
  }).join("");
  const lines = v.regions.map((r, i) => r.type === "line" ? `<g class="vl${on(r) ? " sel" : ""}" data-sel="m${i}" tabindex="0" role="button" aria-label="${esc(r.name)}"><polyline points="${pts(r)}" class="hit"/><polyline points="${pts(r)}" class="ln"/></g>` : "").join("");
  const seen = new Set();
  const labels = v.regions.map((r, i) => {
    if (r.type === "line") return "";
    const key = r.cut || "m" + i; if (seen.has(key)) return ""; seen.add(key);
    const [cx, cy] = mid(r), n = order.indexOf(r.cut) + 1, xs = r.pts.map(q => q[0]);
    const full = r.cut ? `${n}. ${cutById(r.cut)?.name}` : r.name;
    const short = r.cut && (piece.done.includes(r.cut) || full.length * fs * .5 > (Math.max(...xs) - Math.min(...xs)) * 1.1);
    const text = short ? String(n) : full;  // done or narrow: number only, tap it for the name
    const lx = Math.min(Math.max(cx, x + text.length * fs * .27), x + w - text.length * fs * .27);
    return `<text class="vt${r.cut ? " " + stateOf(piece, r.cut) : " mk"}" x="${lx}" y="${cy}" font-size="${fs}" text-anchor="middle">${esc(text)}${r.cut && piece.done.includes(r.cut) ? " ✓" : ""}</text>`;
  }).join("");
  box.innerHTML = `<div class="viewer"><div class="vtabs">${tabs}</div>
    <svg class="photo" viewBox="${x} ${y} ${w} ${h}" role="img" aria-label="${esc(piece.name)}, ${esc(v.label)}">
      <defs><mask id="vmask" maskUnits="userSpaceOnUse" x="${x}" y="${y}" width="${w}" height="${h}" style="mask-type:alpha"><image href="${esc(v.img)}" x="${x}" y="${y}" width="${w}" height="${h}"/></mask>
        <pattern id="vhatch" width="${fs * .5}" height="${fs * .5}" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="${fs * .5}" height="${fs * .5}" fill="rgba(90,90,90,.35)"/><line x1="0" y1="0" x2="0" y2="${fs * .5}" stroke="rgba(255,248,238,.85)" stroke-width="${fs * .12}"/></pattern></defs>
      <image href="${esc(v.img)}" x="${x}" y="${y}" width="${w}" height="${h}"/>
      <g mask="url(#vmask)" style="--sw:${(w / 200).toFixed(1)}px">${shapes}</g><g style="--sw:${(w / 200).toFixed(1)}px">${lines}</g>${labels}
    </svg>
    <div class="vkey"><span><i class="k next"></i>next</span><span><i class="k prog"></i>in progress</span><span><i class="k done"></i>done</span><span><i class="k later"></i>later</span><span><i class="k mark"></i>leave on</span><span><i class="k line"></i>cut line / landmark</span></div>
    <p class="aka">${esc(v.caption || "")}${v.caption ? ". " : ""}Outlines are drawn by eye on this photo: confirm by feel before you cut.</p>
    <div id="vinfo" aria-live="polite">${info(piece, v)}</div></div>`;
}

function info(piece, v) {
  if (!SEL) return `<p class="empty">Tap an outlined cut or a line for what it is.</p>`;
  if (SEL[0] === "m" && /^m\d+$/.test(SEL)) { const r = v.regions[+SEL.slice(1)]; return r ? `<div class="vcard"><h3>${esc(r.name)}</h3><p>${esc(r.note || "")}</p></div>` : "" }
  const c = cutById(SEL), st = stateOf(piece, SEL); if (!c) return "";
  return `<div class="vcard"><h3>${esc(c.name)} ${STATE_TAG[st]}</h3><p><b>Find it:</b> ${esc(c.find)}</p>
    <div>${c.uses.map(u => `<span class="tag">${esc(u)}</span>`).join("")}</div>
    <p class="row"><a href="#step-${c.id}" data-steps="${c.id}">Steps ↓</a> ${doneButton(piece, c.id)}</p></div>`;
}

// Select a cut or landmark; if this view doesn't show the cut, switch to one that does.
function select(id, keep = false) {
  SEL = SEL === id && !keep ? null : id;
  const piece = pieceById(BD), views = piece.views || [];
  if (SEL && SEL[0] !== "m" && VIEW !== "spin" && !views[VIEW]?.regions.some(r => r.cut === SEL)) {
    const i = views.findIndex(v => v.regions.some(r => r.cut === SEL)); if (i >= 0) VIEW = i;
  }
  renderViewer();
}

// 360: frames shot every 30° or so; drag (or use the slider) to turn the quarter.
function spinner(sp) {
  return `<div class="spin" tabindex="0" aria-label="Drag to turn the quarter"><img src="${esc(sp.frames[0])}" alt="Quarter, turned" draggable="false"></div>
    <input type="range" class="spinr" min="0" max="${sp.frames.length - 1}" value="0" aria-label="Turn">
    <p class="aka">Drag the photo or the slider to turn it.</p>`;
}
function wireSpin() {
  const sp = pieceById(BD).spin, el = $(".spin"), img = $("img", el), r = $(".spinr"), n = sp.frames.length;
  sp.frames.forEach(f => { new Image().src = f });
  let i = 0, x0 = null, i0 = 0;
  const go = k => { i = ((k % n) + n) % n; img.src = sp.frames[i]; r.value = i };
  el.addEventListener("pointerdown", e => { x0 = e.clientX; i0 = i; el.setPointerCapture(e.pointerId) });
  el.addEventListener("pointermove", e => { if (x0 !== null) go(i0 + Math.round((e.clientX - x0) / (el.clientWidth / n / 1.5))) });
  el.addEventListener("pointerup", () => { x0 = null });
  el.addEventListener("keydown", e => { if (e.key === "ArrowRight") go(i + 1); if (e.key === "ArrowLeft") go(i - 1) });
  r.addEventListener("input", () => go(+r.value));
}

async function markDone(cut, on, btn) {
  btn.disabled = true;
  try {
    const res = await fetch("api/done", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ piece: BD, cut, done: on }) });
    const r = await res.json(); if (!res.ok) throw new Error(r.error || res.statusText);
    await load();
  } catch (e) { btn.disabled = false; alert("Couldn't save that: " + e.message) }
}

function renderMsg(m) {
  if (m.role === "you") return `<div class="msg you">${m.img ? `<img src="${esc(m.img)}" alt="Your photo">` : ""}${esc(m.text || "")}</div>`;
  if (m.role === "wait") return `<div class="msg ai"><span class="who">Claude</span><p class="wait">Looking at your photo. This takes about 20 seconds</p></div>`;
  if (m.role === "err") return `<div class="msg ai"><span class="who">Claude</span><p class="warn">${esc(m.text)}</p></div>`;
  const r = m.r, c = CUTS.cuts.find(x => x.id === r.next_cut_id);
  return `<div class="msg ai"><span class="who">Claude</span>
    ${r.annotated || r.photo ? `<img src="${esc(r.annotated || r.photo)}" alt="Your photo with the cut drawn on it">` : ""}
    <p>${esc(r.sees)}</p>
    ${c ? `<p><span class="tag">Next: ${esc(c.name)}</span></p>` : ""}
    ${r.steps.length ? `<ol>${r.steps.map(x => `<li>${esc(x)}</li>`).join("")}</ol>` : ""}
    ${r.caution ? `<p class="warn">⚠ ${esc(r.caution)}</p>` : ""}
    ${r.need ? `<p class="warn">📷 ${esc(r.need)}</p>` : ""}</div>`;
}

function shrink(file) {
  return new Promise((ok, bad) => {
    const img = new Image(); img.onerror = () => bad(new Error("Could not read that photo"));
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height)), cv = document.createElement("canvas");
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(img.src); ok(cv.toDataURL("image/jpeg", .85));
    };
    img.src = URL.createObjectURL(file);
  });
}

async function send(form) {
  const id = BD, piece = pieceById(id), t = thread(id), file = form.photo.files[0], message = form.message.value.trim(), side = form.side.value.trim();
  if (!file && !message) return;
  const btn = form.querySelector("[type=submit]"); btn.disabled = true;
  try {
    const image = file ? await shrink(file) : null;
    t.side = side; t.msgs.push({ role: "you", text: message, img: null }); saveThread(id, t);
    const youIdx = t.msgs.length - 1;
    $("#msgs").innerHTML = t.msgs.map(renderMsg).join("") + renderMsg({ role: "wait" });
    if (image) [...document.querySelectorAll("#msgs .msg.you")].pop()?.insertAdjacentHTML("afterbegin", `<img src="${image}" alt="">`);
    $("#chat").scrollIntoView({ block: "end", behavior: "smooth" });
    const res = await fetch("api/guide", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ primal: piece.primal, piece: piece.implicit ? null : id, side, message, image, thread: t.thread }) });
    const r = await res.json();
    if (!res.ok) throw new Error(r.error || res.statusText);
    t.thread = r.thread; t.msgs[youIdx].img = r.photo; t.msgs.push({ role: "ai", r });
  } catch (e) { t.msgs.push({ role: "err", text: "Didn't work: " + e.message }) }
  saveThread(id, t); if (BD === id) renderBreakdown(); btn.disabled = false;
  $("#msgs .msg:last-child")?.scrollIntoView({ block: "start", behavior: "smooth" });
}

$("#breakdown").addEventListener("click", e => {
  const q = e.target.closest("[data-q]"); if (q) return openBreakdown(q.dataset.q);
  const d = e.target.closest("[data-done]"); if (d) return markDone(d.dataset.done, d.dataset.on === "1", d);
  const vw = e.target.closest("[data-vw]"); if (vw) { VIEW = vw.dataset.vw === "spin" ? "spin" : +vw.dataset.vw; return renderViewer() }
  const st = e.target.closest("[data-steps]");
  if (st) { e.preventDefault(); const li = document.getElementById("step-" + st.dataset.steps); $("details", li).open = true; li.scrollIntoView({ behavior: "smooth", block: "center" }); return }
  const sel = e.target.closest("[data-sel]");
  if (sel) { if (sel.closest("#viewer")) select(sel.dataset.sel); else select(sel.dataset.sel, true); return }  // order list: show it, don't toggle
  if (e.target.id === "newthread" && confirm("Start a new thread for this piece? The old one is cleared from this device.")) { localStorage.removeItem("elk-thread-" + BD); renderBreakdown() }
  if (e.target.matches(".msg img")) zoom(e.target.src);
});
$("#breakdown").addEventListener("keydown", e => {
  const sel = e.target.closest?.("#viewer [data-sel]");
  if (sel && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); select(sel.dataset.sel) }
});
$("#breakdown").addEventListener("change", e => {
  if (e.target.name !== "photo") return; const f = e.target.files[0], pv = $("#preview");
  pv.hidden = !f; if (f) pv.src = URL.createObjectURL(f);
});
$("#breakdown").addEventListener("submit", e => { e.preventDefault(); send(e.target) });

function render(cuts, hunt, log) {
  const done = new Set([...(hunt.done_cuts || []), ...(hunt.pieces || []).flatMap(x => x.done)]);  // on any side
  const photosFor = id => hunt.photos.filter(p => (p.cuts || []).includes(id));
  $("#guide").innerHTML = elkMap(cuts, done) + cuts.primals.map(p => {
    const list = p.order.map(id => cuts.cuts.find(c => c.id === id)).filter(Boolean);
    return `<h2>${esc(p.name)}</h2><p class="summary">${esc(p.summary)}</p>
      <ul class="marks">${p.landmarks.map(l => `<li>${esc(l)}</li>`).join("")}</ul>
      <div class="cuts">${list.map((c, i) => `<article class="cut" id="cut-${c.id}">
        <h3><span class="n">${i + 1}</span>${esc(c.name)}</h3>
        ${c.aka ? `<div class="aka">${c.aka.map(esc).join(" · ")}</div>` : ""}
        <p><b>Find it:</b> ${esc(c.find)}</p>
        <ol>${c.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol>
        <div>${c.uses.map(u => `<span class="tag">${esc(u)}</span>`).join("")}${done.has(c.id) ? `<span class="tag done">done 2026</span>` : ""}</div>
        <p class="aka">${esc(c.pack)}</p>
        ${photosFor(c.id).length ? `<div class="thumbs">${photosFor(c.id).map(ph => `<img loading="lazy" src="${esc(ph.file)}" alt="${esc(ph.caption)}" title="${esc(ph.caption)}">`).join("")}</div>` : ""}
      </article>`).join("")}</div>`;
  }).join("");

  const lb = log.reduce((s, r) => s + (parseFloat(r.total_lb) || 0), 0);
  const pk = log.reduce((s, r) => s + (parseInt(r.packages) || 0), 0);
  const cols = ["date", "source", "cut", "packages", "package_size", "total_lb", "notes"];
  $("#hunt").innerHTML = `<h2>${esc(hunt.title)}</h2>
    <p class="summary">Harvested ${esc(new Date(hunt.harvested).toLocaleString([], { weekday: "long", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }))} · ${esc(hunt.tag)}</p>
    <div class="stats"><div><b>${lb.toFixed(1)}</b>lb logged</div><div><b>${pk}</b>packages counted</div><div><b>${hunt.remaining.length}</b>quarters left</div></div>
    <h2>Freezer log</h2><div class="table-wrap"><table><thead><tr>${cols.map(c => `<th>${c.replace("_", " ")}</th>`).join("")}</tr></thead>
    <tbody>${log.map(r => `<tr>${cols.map(c => `<td class="${["packages", "total_lb"].includes(c) ? "num" : ""}">${esc(r[c])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
    <h2>Quarters</h2><ul class="marks" id="hunt-pieces"></ul>
    <h2>Day by day</h2>${(hunt.progress || []).map(d => `<h3 class="day">${esc(new Date(d.date + "T12:00").toLocaleDateString([], { weekday: "long", month: "short", day: "numeric" }))}</h3>
      <ul class="marks">${d.done.map(x => `<li>✓ ${esc(x)}</li>`).join("")}${(d.in_progress || []).map(x => `<li>… ${esc(x)}</li>`).join("")}</ul>`).join("")}
    <h2>Still to do</h2><ul class="marks">${hunt.remaining.map(r => `<li>${esc(r)}</li>`).join("")}</ul>
    <h2>Lessons</h2><ul class="marks">${hunt.lessons.map(r => `<li>${esc(r)}</li>`).join("")}</ul>
    <h2>Handling</h2><ul class="marks">${hunt.handling.map(r => `<li>${esc(r)}</li>`).join("")}</ul>
    <h2>Photos</h2><div class="gallery">${hunt.photos.map(p => `<figure><img loading="lazy" src="${esc(p.file)}" alt="${esc(p.caption)}"><figcaption>${esc(p.caption)}</figcaption></figure>`).join("")}</div>`;
  CUTS = cuts; DONE = done; HUNT = hunt; renderBreakdown();
  $("#hunt-pieces").innerHTML = pieces().map(x => { const n = primalById(x.primal).order.length;
    return `<li><a href="#" data-q="${x.id}">${esc(x.name)}</a>: ${x.done.length} of ${n} cuts done${(x.in_progress || []).length ? `, in progress: ${x.in_progress.map(id => esc(cutById(id)?.name || id).toLowerCase()).join(", ")}` : ""}</li>` }).join("");
  wireMap(cuts, done);
  document.querySelectorAll("#guide img, #hunt img").forEach(img => img.addEventListener("click", () => zoom(img.src)));
}

document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => show(b.dataset.view)));

$("#hunt").addEventListener("click", e => { const q = e.target.closest("[data-q]"); if (q) { e.preventDefault(); openBreakdown(q.dataset.q) } });

// Loaded again after "mark done", so the map, counts and order all update.
const load = () => Promise.all([
  fetch("data/cuts.json", { cache: "no-cache" }).then(r => r.json()),
  fetch("data/hunts/2026-elk/hunt.json", { cache: "no-cache" }).then(r => r.json()),
  fetch("data/hunts/2026-elk/freezer-log.csv", { cache: "no-cache" }).then(r => r.text()).then(parseCSV),
]).then(([c, h, l]) => render(c, h, l));
load().catch(e => { $("#guide").textContent = "Could not load data: " + e.message });
</script>
</body>
</html>
